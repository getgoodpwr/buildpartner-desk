<style>
  :root{
    --ink:#161616; --ink2:#4a4a4a; --mute:#8a8a8a; --line:#e6e3dc; --bg:#f6f4ef; --card:#fff;
    --sun:#f5a400; --sun-d:#c98500; --sun-l:#fff4d9;
    --ok:#1e8a4c; --ok-l:#e3f4ea; --warn:#b54708; --warn-l:#fdecdc; --bad:#b42318; --bad-l:#fde8e6; --info:#2a5db0; --info-l:#e6eefb;
    --r:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  a{color:var(--sun-d)}
  .top{background:#141414;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .top img{height:44px;width:auto}
  .brand{font-weight:700;font-size:17px;letter-spacing:.2px}
  .brand span{display:block;font-weight:500;font-size:12px;color:#c9c9c9;letter-spacing:.4px;text-transform:uppercase}
  .top .sp{flex:1}
  .top button{background:transparent;color:#ddd;border:1px solid #444;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  main{max-width:980px;margin:0 auto;padding:24px 16px 80px}
  .narrow{max-width:720px;margin:0 auto}
  h1{font-size:24px;margin:0 0 6px} h2{font-size:18px;margin:0 0 12px} h3{font-size:16px;margin:0}
  .sub{color:var(--ink2);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#111;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  .btn:hover{background:#ffb31a} .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)} .btn.ghost:hover{background:#faf8f3}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
  .btn.ok{background:var(--ok);color:#fff} .btn.bad{background:#fff;color:var(--bad);border:1px solid #f1c1bc}
  label.f{display:block;font-weight:600;font-size:13px;margin:0 0 5px;color:var(--ink2)}
  input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sun);outline-offset:-1px;border-color:var(--sun)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px} .row>div{min-width:0}
  .mb{margin-bottom:14px}
  .chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .c-missing{background:var(--sun-l);color:#8a5a00} .c-redo{background:var(--bad-l);color:var(--bad)}
  .c-sub{background:var(--info-l);color:var(--info)} .c-ok{background:var(--ok-l);color:var(--ok)} .c-muted{background:#eee;color:#666}
  .bar{height:8px;background:#ece8df;border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
  .muted{color:var(--mute);font-size:13px}
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer}
  .tabs button.on{border-color:var(--sun);color:var(--ink)}
  .grid-states{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .ck{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;background:#fff}
  .ck input{margin-top:3px;accent-color:var(--sun-d)}
  .ck.on{border-color:var(--sun);background:var(--sun-l)}
  .doc-ck{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)} .doc-ck:first-child{border-top:0}
  .doc-ck input{margin-top:4px;accent-color:var(--sun-d);width:16px;height:16px;flex:none}
  .doc-ck small{display:block;color:var(--mute);font-size:12.5px;line-height:1.45}
  .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--sun-d);margin-left:6px}
  .warnbox{background:var(--warn-l);color:var(--warn);border-radius:9px;padding:10px 12px;font-size:13.5px;margin-top:8px}
  .req{display:grid;grid-template-columns:1.6fr 1fr auto;gap:14px;align-items:center;cursor:pointer}
  .req:hover{border-color:#d8cfbd}
  .req .meta{font-size:12.5px;color:var(--mute)}
  .filters{display:flex;gap:10px;margin-bottom:14px} .filters input{flex:1} .filters select{width:170px}
  /* BP view */
  .hello{background:#141414;color:#fff;border-radius:var(--r);padding:22px;margin-bottom:16px}
  .hello h1{color:#fff} .hello p{color:#d6d6d6;margin:0}
  .hello .bar{background:#333;margin-top:14px}
  .item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
  .hint{color:var(--ink2);font-size:14px;margin:0 0 12px}
  .note{background:var(--bad-l);color:var(--bad);border-radius:8px;padding:8px 11px;font-size:13.5px;margin-bottom:12px}
  .drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #d6cdb8;border-radius:10px;padding:14px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:14px;background:#fffdf8;text-align:center}
  .drop:hover,.drop.drag{border-color:var(--sun);background:var(--sun-l)}
  .drop input{display:none}
  .okline{color:var(--ok);font-size:13.5px;font-weight:600;margin:10px 0 0}
  .prog{font-size:13px;color:var(--info);margin-top:8px}
  .done{background:var(--ok-l);border:1px solid #bfe3cc;color:#14532d;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;font-weight:500}
  /* drawer */
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .25s;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
  .drawer.open{transform:none} .shade.open{display:block}
  .drawer header{position:sticky;top:0;background:#141414;color:#fff;padding:16px 18px;display:flex;gap:10px;align-items:flex-start;z-index:1}
  .drawer header h2{color:#fff;margin:0} .drawer header .x{margin-left:auto;background:none;border:0;color:#fff;font-size:24px;cursor:pointer;line-height:1}
  .drawer .body{padding:16px}
  .di{border-top:1px solid var(--line);padding:12px 0} .di:first-child{border-top:0;padding-top:0}
  .di .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .di .files a{display:block;font-size:13px;word-break:break-all}
  .kv{font-size:13.5px;color:var(--ink2);margin:2px 0}
  .footer-acts{display:flex;gap:8px;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:#141414;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;transition:transform .25s;z-index:40;max-width:92vw}
  #toast.show{transform:translateX(-50%)} #toast.err{background:var(--bad)}
  .center{text-align:center;padding:40px 0;color:var(--mute)}
  .spin{width:22px;height:22px;border:3px solid #e2dccd;border-top-color:var(--sun);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tabs{overflow-x:auto}
  .ptw{overflow-x:auto;margin-top:8px}
  .ptable{width:100%;border-collapse:collapse;font-size:14px;min-width:600px;table-layout:fixed}
  .ptable th:nth-child(1){width:20%} .ptable th:nth-child(2){width:13%} .ptable th:nth-child(4){width:11%} .ptable th:nth-child(5){width:150px}
  .ptable td{overflow-wrap:anywhere}
  .pacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .ptable th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
  .ptable td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .ptable tr:last-child td{border-bottom:0}
  .ptable tr.old td{opacity:.55}
  .ptable .amt{font-weight:700;white-space:nowrap}
  .quote{color:var(--mute);font-size:12.5px;font-style:italic;margin-top:4px}
  code{background:#f1ede4;padding:1px 5px;border-radius:4px;font-size:.92em}
  .fillbtn{width:100%;justify-content:center;padding:13px}
  .or{text-align:center;color:var(--mute);font-size:12.5px;margin:8px 0}
  .optlist{display:grid;gap:6px;margin-bottom:12px}
  .sig{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  .sig canvas{width:100%;height:130px;border:1.5px dashed #d6cdb8;border-radius:8px;background:#fffdf8;touch-action:none;display:block}
  .sig-tabs{display:flex;gap:6px;margin-bottom:8px}
  .sig-tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer}
  .sig-tabs button.on{background:var(--sun-l);border-color:var(--sun)}
  @media (max-width:640px){
    .row{grid-template-columns:1fr} .req{grid-template-columns:1fr} .filters{flex-direction:column} .filters select{width:100%}
    main{padding:18px 16px 70px}
  }
</style>

<script>
/* ===== CONFIG ===== */
const API_URL  = 'https://script.google.com/macros/s/AKfycbzmVgj1hEmPZVIfoomyi3iqVLOSWRtikhBTz9bGRckjXflbU0a4Ln1xXFXez-8W_pylQA/exec';
const LOGO_URL = ''; // optional: put 'logo.png' here later if you upload the skull logo to the repo (a built-in icon is used until then)

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let toastT;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'show err':'show'; clearTimeout(toastT); toastT=setTimeout(()=>t.className=err?'err':'',3500); }
async function api(action, payload={}){
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, ...payload}) });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'Something went wrong.');
  return j.data;
}
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '—';
const chip = (status, bp) => {
  const m = { 'Missing':['c-missing', bp?'Needed':'Missing'], 'Needs Redo':['c-redo', bp?'Please re-upload':'Needs redo'],
    'Submitted':['c-sub', bp?'Received':'Submitted'], 'Approved':['c-ok','Approved'],
    'Draft':['c-muted','Draft'], 'Sent':['c-missing','Sent'], 'In Progress':['c-sub','In progress'], 'Complete':['c-sub','All received'], 'Closed':['c-muted','Closed'] };
  const [c,t] = m[status] || ['c-muted', status];
  return `<span class="chip ${c}">${esc(t)}</span>`;
};
const readB64 = file => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=no; r.readAsDataURL(file); });

if (LOGO_URL){
  const l=$('#logo'); l.onload=()=>l.style.display='block'; l.onerror=()=>{}; l.src=LOGO_URL;
  document.querySelectorAll('link[rel=icon],link[rel=apple-touch-icon]').forEach(x => x.href = LOGO_URL);
}

/* =========================================================
   BP UPLOAD VIEW
   ========================================================= */
let BP = null;
async function bpView(){
  try { BP = await api('getRequest', { token: TOKEN }); renderBP(); }
  catch(e){ app.innerHTML = `<div class="card narrow"><h2>We couldn't open this page</h2><p>${esc(e.message)}</p></div>`; }
}

function renderBP(){
  const total = BP.items.length;
  const done = BP.items.filter(i => i.status==='Submitted' || i.status==='Approved').length;
  const pct = total ? Math.round(done/total*100) : 0;
  const allIn = total && done === total;
  app.innerHTML = `<div class="narrow">
    <div class="hello">
      <h1>Hi ${esc(BP.contact)}! 👋</h1>
      <p>Thank you for helping us update <b style="color:#fff">${esc(BP.bpName)}</b>'s file with GoodPWR Solar. Please upload the documents below. You can do them all now or come back to this link anytime.</p>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p style="margin-top:8px;font-size:13px">${done} of ${total} received</p>
    </div>
    ${BP.closed ? `<div class="card"><b>This request has been closed.</b> If you still need to send something, please email <a href="mailto:${esc(BP.compliance)}">${esc(BP.compliance)}</a>.</div>` : ''}
    ${allIn && !BP.closed ? `<div class="done">✓ All set! We've received everything. Thank you so much — our team will review and reach out only if something needs a quick update.</div>` : ''}
    ${BP.items.map(itemCard).join('')}
    <p class="muted" style="text-align:center;margin-top:20px">Files go straight to GoodPWR Solar's secure compliance folder. Max ${BP.maxMb} MB per file.<br>Questions? Email <a href="mailto:${esc(BP.compliance)}">${esc(BP.compliance)}</a></p>
  </div>`;
  app.querySelectorAll('.drop input').forEach(inp => inp.addEventListener('change', () => uploadFiles(inp.dataset.key, inp.files)));
  app.querySelectorAll('.drop').forEach(d => {
    d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('drag'); });
    d.addEventListener('dragleave', () => d.classList.remove('drag'));
    d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('drag'); uploadFiles(d.querySelector('input').dataset.key, e.dataTransfer.files); });
  });
}

function itemCard(i){
  const canUpload = !BP.closed && i.status !== 'Approved';
  return `<div class="card" id="it-${esc(i.key)}">
    <div class="item-head"><h3>${esc(i.label)}</h3>${chip(i.status, true)}</div>
    <p class="hint">${esc(i.hint)}</p>
    ${(i.links||[]).length ? `<p style="margin:-4px 0 12px;display:flex;flex-wrap:wrap;gap:8px">${i.links.map(l => l.tpl ? `<button type="button" class="btn sm ghost" onclick="openTemplate('${esc(l.tpl)}')">📄 ${l.view ? 'View' : 'Blank'} ${esc(l.label)}</button>` : `<a class="btn sm ghost" href="${esc(l.url)}" target="_blank" rel="noopener">📄 ${esc(l.label)}</a>`).join('')}</p>` : ''}
    ${i.note ? `<div class="note"><b>Quick update needed:</b> ${esc(i.note)}</div>` : ''}
    ${canUpload && FORMS[i.key] ? `<button type="button" class="btn fillbtn" onclick="openForm('${esc(i.key)}')">✍️ ${i.status==='Submitted' ? 'Fill & sign again' : 'Fill & sign online'}</button><div class="or">or upload your own copy</div>` : ''}
    ${canUpload ? `<label class="drop"><input type="file" multiple data-key="${esc(i.key)}" accept=".pdf,.jpg,.jpeg,.png,.heic,.doc,.docx,.xls,.xlsx">
      📎 ${i.status==='Submitted' ? 'Upload another file' : 'Tap to choose file(s) or drop them here'}</label>` : ''}
    <div class="prog" id="pg-${esc(i.key)}"></div>
    ${i.status==='Submitted' ? `<p class="okline">✓ Received${i.fileCount>1?` (${i.fileCount} files)`:''} — thank you!</p>` : ''}
    ${i.status==='Approved' ? `<p class="okline">✓ Approved — nothing else needed here.</p>` : ''}
  </div>`;
}

async function uploadFiles(key, fileList){
  const files = [...fileList]; if(!files.length) return;
  const pg = document.getElementById('pg-'+key);
  const tooBig = files.find(f => f.size > BP.maxMb*1024*1024);
  if (tooBig){ toast(`"${tooBig.name}" is over ${BP.maxMb} MB. Please upload a smaller file.`, true); return; }
  document.querySelectorAll(`#it-${CSS.escape(key)} .drop`).forEach(d => d.style.pointerEvents='none');
  try {
    let fresh = null;
    for (let n=0; n<files.length; n++){
      const f = files[n];
      pg.innerHTML = `<span class="spin" style="width:14px;height:14px;border-width:2px"></span> Uploading ${files.length>1?`${n+1} of ${files.length}: `:''}${esc(f.name)}…`;
      const data = await readB64(f);
      fresh = await api('upload', { token: TOKEN, itemKey: key, fileName: f.name, mimeType: f.type, data });
    }
    toast(files.length>1 ? 'Files uploaded. Thank you!' : 'Uploaded. Thank you!');
    BP = fresh;
    renderBP();
    const el = document.getElementById('it-'+key); if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  } catch(e){
    pg.textContent = '';
    toast(e.message, true);
    document.querySelectorAll(`#it-${CSS.escape(key)} .drop`).forEach(d => d.style.pointerEvents='');
  }
}

const PDFLIB_URLS = ['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js', 'https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'];
let pdfLibReady = null;
function loadPdfLib(){
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (pdfLibReady) return pdfLibReady;
  pdfLibReady = new Promise((ok, no) => {
    const tryAt = n => {
      if (n >= PDFLIB_URLS.length) { pdfLibReady = null; return no(new Error('Could not load the PDF tool. Please check your internet connection and try again.')); }
      const s = document.createElement('script'); s.src = PDFLIB_URLS[n];
      s.onload = () => ok(window.PDFLib); s.onerror = () => { s.remove(); tryAt(n + 1); };
      document.head.appendChild(s);
    };
    tryAt(0);
  });
  return pdfLibReady;
}
const tplBytes = k => { const b = atob(document.getElementById('tpl-' + k).textContent.trim()); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
function openTemplate(k){
  const url = URL.createObjectURL(new Blob([tplBytes(k)], { type: 'application/pdf' }));
  const w = window.open(url, '_blank');
  if (!w) { const a = document.createElement('a'); a.href = url; a.download = k + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
}
const u8ToB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const todayStr = () => new Date().toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
const stampStr = () => new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });

/* ----- signature pad (draw or type) ----- */
function sigPadHtml(id){
  return `<div class="sig" id="${id}">
    <div class="sig-tabs"><button type="button" class="on" data-m="draw">✍️ Draw</button><button type="button" data-m="type">⌨️ Type</button></div>
    <canvas width="900" height="220"></canvas>
    <input type="text" class="sig-type" placeholder="Type your full name" style="display:none;margin-top:8px">
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span class="muted">Sign inside the box</span><a href="#" class="sig-clear">Clear</a></div></div>`;
}
function initSigPad(id){
  const root = document.getElementById(id), cv = root.querySelector('canvas'), ctx = cv.getContext('2d'), typed = root.querySelector('.sig-type');
  const st = { mode: 'draw', has: false, drawing: false };
  const reset = () => { ctx.clearRect(0, 0, cv.width, cv.height); st.has = false; };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0d2a6b';
  cv.addEventListener('pointerdown', e => { if (st.mode !== 'draw') return; st.drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y + 0.1); ctx.stroke(); st.has = true; e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if (!st.drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); });
  const end = () => { st.drawing = false; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  const renderTyped = () => {
    reset(); const t = typed.value.trim(); if (!t) return;
    let size = 110; ctx.fillStyle = '#0d2a6b';
    do { ctx.font = `${size}px "Dancing Script", "Brush Script MT", cursive`; size -= 4; } while (ctx.measureText(t).width > cv.width - 40 && size > 30);
    ctx.textBaseline = 'middle'; ctx.fillText(t, 20, cv.height / 2 + 6); st.has = true;
  };
  typed.addEventListener('input', renderTyped);
  root.querySelectorAll('.sig-tabs button').forEach(b => b.onclick = () => {
    root.querySelectorAll('.sig-tabs button').forEach(x => x.classList.toggle('on', x === b));
    st.mode = b.dataset.m; typed.style.display = st.mode === 'type' ? 'block' : 'none'; reset();
    if (st.mode === 'type') { typed.focus(); renderTyped(); }
  });
  root.querySelector('.sig-clear').onclick = e => { e.preventDefault(); reset(); typed.value = ''; };
  return {
    has: () => st.has,
    method: () => st.mode === 'type' ? 'Typed signature' : 'Drawn signature',
    png: () => { // trim empty space around the signature
      const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let x0 = cv.width, y0 = cv.height, x1 = 0, y1 = 0;
      for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) if (d[(y * cv.width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const c2 = document.createElement('canvas'); const w = Math.max(1, x1 - x0 + 12), h = Math.max(1, y1 - y0 + 12);
      c2.width = w; c2.height = h; c2.getContext('2d').drawImage(cv, x0 - 6, y0 - 6, w, h, 0, 0, w, h);
      const b = atob(c2.toDataURL('image/png').split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u;
    }
  };
}
async function drawSig(doc, page, sigPng, rect){ // rect = [x1, y1, x2, y2] in PDF points
  const img = await doc.embedPng(sigPng);
  const bw = rect[2] - rect[0], bh = rect[3] - rect[1];
  const s = Math.min(bw / img.width, (bh + 6) / img.height);
  page.drawImage(img, { x: rect[0] + 2, y: rect[1] - 2, width: img.width * s, height: img.height * s });
}
function auditLine(page, font, name){
  page.drawText(`Signed electronically by ${name} on ${stampStr()} via the GoodPWR Solar Build Partner portal.`, { x: 30, y: 10, size: 6.5, font, color: PDFLib.rgb(0.45, 0.45, 0.45) });
}
const fieldRect = (form, name) => { try { const w = form.getField(name).acroField.getWidgets()[0]; const r = w.getRectangle(); return [r.x, r.y, r.x + r.width, r.y + r.height]; } catch (e) { return null; } };
const dropFields = (form, names) => names.forEach(n => { try { form.removeField(form.getField(n)); } catch (e) {} });

      </div>
      <div class="card"><b>ACH authorization</b>
        <p style="font-size:13.5px;color:var(--ink2);margin:6px 0 10px">I authorize GoodPWR Solar LLC to initiate credit entries, and if necessary debit entries and adjustments to correct any credit entered in error, to the account above. This authorization stays in effect until GoodPWR Solar LLC receives written notice from me to cancel it, in time to act on it. I confirm I am authorized to sign for this account.</p>

      <p class="muted" style="text-align:center">🔒 Your bank details are saved only as a confidential PDF in GoodPWR Solar's secure folder.</p>`,
    init(){ this.sig = initSigPad('a_sig'); },
    validate(){
      const rt = $('#a_rt').value.replace(/\D/g, ''), acct = $('#a_acct').value.replace(/\s/g, '');
      if (!$('#a_name').value.trim() || !$('#a_bank').value.trim()) return 'Please enter the name on the account and the bank name.';
      if (rt.length !== 9) return 'Routing number must be 9 digits.';
      const d = rt.split('').map(Number);
      if ((3 * (d[0] + d[3] + d[6]) + 7 * (d[1] + d[4] + d[7]) + (d[2] + d[5] + d[8])) % 10 !== 0) return "That routing number doesn't look right. Please double-check it.";
      if (!/^\d{4,17}$/.test(acct)) return 'Account number should be 4 to 17 digits.';
      if (acct !== $('#a_acct2').value.replace(/\s/g, '')) return "Account numbers don't match.";
      if (!$('#a_type').value) return 'Please choose the account type.';
      if (!$('#a_ok').checked) return 'Please accept the ACH authorization.';
      if (!$('#a_by').value.trim() || !$('#a_title').value.trim()) return 'Please enter your name and title.';
      if (!this.sig.has()) return 'Please sign in the signature box.';
      return '';
    },
    async build(){
      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const doc = await PDFDocument.create(), page = doc.addPage([612, 792]);
      const R = await doc.embedFont(StandardFonts.Helvetica), B = await doc.embedFont(StandardFonts.HelveticaBold);
      const gold = rgb(0.72, 0.47, 0.0), grey = rgb(0.45, 0.45, 0.45), ink = rgb(0.1, 0.1, 0.1), line = rgb(0.85, 0.83, 0.78);
      let y = 740; const L = 50, V = 210, W = 512;
      const wrap = (t, f, s, w) => { const out = []; let cur = ''; t.split(' ').forEach(word => { const nx = cur ? cur + ' ' + word : word; if (f.widthOfTextAtSize(nx, s) > w) { out.push(cur); cur = word; } else cur = nx; }); if (cur) out.push(cur); return out; };
      page.drawText('GOODPWR SOLAR · ACH AUTHORIZATION — CONFIDENTIAL', { x: L, y, size: 8.5, font: B, color: gold }); y -= 24;
      page.drawText(BP.bpName, { x: L, y, size: 18, font: B, color: ink }); y -= 16;
      page.drawText('Submitted ' + stampStr() + ' via the GoodPWR Solar Build Partner portal', { x: L, y, size: 8.5, font: R, color: grey }); y -= 10;
      page.drawRectangle({ x: L, y, width: W, height: 1.5, color: gold }); y -= 26;
      const section = t => { page.drawText(t, { x: L, y, size: 8.5, font: B, color: ink }); y -= 6; page.drawRectangle({ x: L, y, width: W, height: 0.6, color: line }); y -= 16; };
      const row = (k, v) => { page.drawText(k, { x: L, y, size: 10, font: R, color: grey }); wrap(String(v || '—'), R, 10, W - (V - L)).forEach((ln, i) => { page.drawText(ln, { x: V, y: y - i * 13, size: 10, font: R, color: ink }); if (i) y -= 13; }); y -= 18; };
      section('ACH PAYMENTS (CONFIDENTIAL)');
      row('Name on account', $('#a_name').value.trim()); row('Bank', $('#a_bank').value.trim()); row('Bank address', $('#a_baddr').value.trim());
      row('Routing number', $('#a_rt').value.replace(/\D/g, '')); row('Account number', $('#a_acct').value.replace(/\s/g, '')); row('Account type', $('#a_type').value);
      row('ACH authorization', 'Accepted'); row('Authorized by', $('#a_by').value.trim() + ', ' + $('#a_title').value.trim()); row('Authorized at', stampStr());
      row('Verification', 'Unverified (to be completed by GoodPWR Solar Finance)');
      y -= 6; section('AUTHORIZATION');
      wrap('I authorize GoodPWR Solar LLC to initiate credit entries, and if necessary debit entries and adjustments to correct any credit entered in error, to the account above. This authorization stays in effect until GoodPWR Solar LLC receives written notice from me to cancel it, in time to act on it. I confirm I am authorized to sign for this account.', R, 9.5, W)
        .forEach(ln => { page.drawText(ln, { x: L, y, size: 9.5, font: R, color: ink }); y -= 13; });
      y -= 10; section('SIGNATURE');
      await drawSig(doc, page, this.sig.png(), [L, y - 44, L + 220, y]); y -= 50;
      page.drawRectangle({ x: L, y, width: 240, height: 0.8, color: ink }); y -= 20;
      row('Signed by', $('#a_by').value.trim() + ', ' + $('#a_title').value.trim()); if ($('#a_email').value.trim()) row('Email', $('#a_email').value.trim());
      row('Date', stampStr()); row('Method', this.sig.method());
      page.drawText('CONFIDENTIAL — contains bank details. Saved in GoodPWR Solar\'s restricted folder. Do not forward.', { x: L, y: 40, size: 7.5, font: R, color: grey });
      return doc.save();
    }
  }
};

const S = { session: store.get('bpf_session'), email: store.get('bpf_email'), states: [], catalog: [], reqs: [], folders: null, tab: 'list', open: null };
const readCache = k => { try { return JSON.parse(store.get(k) || 'null'); } catch(e){ return null; } };

async function sapi(action, payload={}){
  try { return await api(action, { session: S.session, ...payload }); }
  catch(e){
    if (String(e.message).indexOf('SIGNIN:') === 0){ signOutLocal(); loginView(e.message.replace('SIGNIN:','').trim()); throw new Error('Please sign in.'); }
    throw e;
  }
}
function signOutLocal(){ ['bpf_session','bpf_email','bpf_boot','bpf_folders'].forEach(k => store.del(k)); S.session = null; $('#logoutBtn').style.display = 'none'; closeDrawer(); }

function applyBoot(b){ S.email = b.email; S.sender = b.sender; S.testMode = !!b.testMode; S.testEmail = b.testEmail || ''; S.states = b.states; S.catalog = b.catalog; S.reqs = b.requests; }

async function staffBoot(){
  if (!S.session) return loginView();
  $('#logoutBtn').style.display = 'inline-block';
  // 1) Show the last saved copy instantly, 2) refresh from the server in the background.
  const cached = readCache('bpf_boot');
  if (cached){ applyBoot(cached); staffView(); }
  try {
    const b = await sapi('boot');
    store.set('bpf_boot', JSON.stringify(b));
    applyBoot(b);
    if (!cached || S.tab === 'list') staffView(); else updateHeader();
  } catch(e){ if (S.session && !cached) app.innerHTML = `<div class="card narrow"><p>${esc(e.message)}</p></div>`; }
  S.folders = readCache('bpf_folders');
  loadFolders(); // warm up the folder list for the New request tab

// Builds the document list instantly in the browser (same rules as the server).
function pickDocs(){
  return S.catalog.filter(d => {
    if (d.key === 'license') return !F.states.length;
    if (d.key === 'wc_coi') return F.wcMode === 'coi';
    if (d.key === 'wc_aff') return F.wcMode === 'affidavit';
    if (d.key.indexOf('st_') === 0) return F.states.includes(d.state);
    if (d.key.indexOf('il_') === 0) return F.states.includes('Illinois');
    if (d.key.indexOf('nv_') === 0) return F.states.includes('Nevada');
    if (d.key.indexOf('lr_') === 0) return F.lightreach;
    return true;
  });
}
function drawDocs(){
  $('#wcWarn').innerHTML = F.wcMode==='affidavit' ? `<div class="warnbox">Last resort only: partner has no employees, the state allows the exemption, and the financier allows it.${F.lightreach ? ' <b>LightReach does not permit exemptions.</b>' : ''}</div>` : '';
  $('#docs').innerHTML = pickDocs().map(d => `<label class="doc-ck"><input type="checkbox" value="${esc(d.key)}" ${F.unchecked.has(d.key)?'':'checked'}>
    <div><b>${esc(d.label)}</b>${d.group!=='Core'?`<span class="grp">${esc(d.group)}</span>`:''}<small>${esc(d.hint.length>220 ? d.hint.slice(0,220)+'…' : d.hint)}</small></div></label>`).join('');
  $('#docs').querySelectorAll('input').forEach(i => i.onchange = () => i.checked ? F.unchecked.delete(i.value) : F.unchecked.add(i.value));

async function submitNew(sendNow){
  const items = [...$('#docs').querySelectorAll('input:checked')].map(i => i.value);
  const body = {
    sendNow, bpName: $('#bpName').value.trim(), contactName: $('#contactName').value.trim(), email: $('#email').value.trim(),
    folderId: $('#folder').value, newFolderName: $('#newFolderName').value.trim(),
    states: F.states, lightreach: F.lightreach, wcMode: F.wcMode, items, notes: $('#notes').value.trim()
  };
  if (!body.bpName || !body.email) return toast('BP name and email are required.', true);
  if (!body.folderId) return toast('Please pick the BP folder.', true);
  if (!items.length) return toast('Select at least one document.', true);
  if (sendNow && !confirm(`Send a request for ${items.length} document${items.length>1?'s':''} to ${body.email}?`)) return;
  const btns = [$('#sendBtn'), $('#draftBtn')]; btns.forEach(b => b.disabled = true);
  $('#sendBtn').textContent = sendNow ? 'Sending…' : 'Saving…';
  try {
    const r = await sapi('createRequest', body);
    toast(sendNow ? 'Request sent! 📨' : 'Saved as draft.');
    const newFolder = body.folderId === '__new__';
    Object.assign(F, { states: [], lightreach: false, wcMode: 'coi', unchecked: new Set() });
    S.tab = 'list'; openReq(r.id);
    loadReqs().then(() => { if (S.tab==='list') listPane(); }).catch(()=>{});
    if (newFolder) loadFolders(true);
    staffView();
  } catch(e){ toast(e.message, true); btns.forEach(b => b.disabled = false); $('#sendBtn').textContent = 'Send request email'; }
}

/* =========================================================
   FREE AGREEMENT READER (no AI)
   Reads the GoodPWR Solar BP Agreement template:
   page 2 (BP name + effective date), Section A Pricing Options,
   Section B Payment Terms, deductions, and the Adder List.
   Any other PDF (addendum, amendment) gets a general $-amount scan.
   ========================================================= */
const PDFJS_URLS = [
  ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs'],
  ['https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs']
];
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = (async () => {
    for (const [lib, worker] of PDFJS_URLS){
      try {
        const pdfjs = await import(lib);
        globalThis.pdfjsWorker = await import(worker); // runs the reader on the page itself (no cross-site worker needed)
        pdfjs.GlobalWorkerOptions.workerSrc = worker;
        return pdfjs;
      } catch(e){}
    }
    pdfjsReady = null;
    throw new Error('Could not load the PDF reader. Please check your internet connection and try again.');
  })();
  return pdfjsReady;
}

/* PDF bytes -> pages of text lines with x positions */
async function pdfLines(bytes){
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({ data: bytes, verbosity: 0 }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    pages.push(groupLines(tc.items.map(i => ({ s: String(i.str || ''), x: i.transform[4], y: i.transform[5] }))));
  }
  return pages;
}
function groupLines(items){
  const segs = items.map(i => ({ s: i.s.replace(/[​­]/g, '').replace(/\s+/g, ' '), x: Math.round(i.x), y: Math.round(i.y) })).filter(i => i.s.trim());
  segs.sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for (const it of segs){
    const l = lines.find(l => Math.abs(l.y - it.y) <= 3);
    if (l) l.segs.push(it); else lines.push({ y: it.y, segs: [it] });
  }
  lines.forEach(l => { l.segs.sort((a, b) => a.x - b.x); l.text = l.segs.map(s => s.s.trim()).join(' ').replace(/\s+/g, ' ').trim(); });
  return lines;
}

const MONEY_RE = /(\+?)\$\s*([\d,]*\.?\d+)\s*(?:\/\s*(watt|w\b|ft|mod|day))?/i;
function parseMoney(t){
  const m = String(t || '').match(MONEY_RE);
  if (!m) return null;
  const amount = Number(m[2].replace(/,/g, ''));
  if (isNaN(amount)) return null;
  const per = (m[3] || '').toLowerCase();
  const unit = per === 'watt' || per === 'w' ? '$/W' : per === 'ft' ? '$ per foot' : per === 'mod' ? '$ per panel' : per === 'day' ? '$ per day' : '$ flat';
  return { amount, unit, plus: !!m[1] };
}
const clean = t => String(t || '').replace(/_{3,}/g, ' ').replace(/(\w) ?fi ll\b/g, '$1fill').replace(/\s+/g, ' ').replace(/\s+([,.)])/g, '$1').replace(/\(\s+/g, '(').trim();

function parseAgreement(pages){
  const items = [], meta = { doc_type: 'Other', doc_date: '', bp_legal_name: '', summary: '', found: [] };
  const add = (category, item, money, conditions, quote, page) => items.push({
    category, item: clean(item), amount: money && typeof money.amount === 'number' ? money.amount : undefined,
    unit: money ? money.unit : 'other', conditions: clean(conditions), source_quote: clean(quote).slice(0, 300), page
  });
  const findPage = re => pages.findIndex(lines => lines.some(l => re.test(l.text)));
  const all = pages.map(ls => ls.map(l => l.text).join('\n')).join('\n');

  // ---- Page 2: effective date + BP legal name
  for (let p = 0; p < Math.min(pages.length, 4); p++){
    pages[p].forEach((l, i) => {
      if (/BUILD PARTNER AGREEMENT/i.test(l.text)) meta.doc_type = 'Master Service Agreement';
      if (!meta.doc_date && /Effective Date/i.test(l.text)){
        const d = l.text.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
        if (d){ const y = d[3].length === 2 ? '20' + d[3] : d[3]; meta.doc_date = y + '-' + d[1].padStart(2, '0') + '-' + d[2].padStart(2, '0'); }
      }
      if (!meta.bp_legal_name && /between\s+GOODPWR/i.test(l.text)){
        const n = l.text.replace(/.*?GOODPWR[^)]*\)\s*and\s*/i, '').replace(/\(?\s*["“]?Build Partner.*$/i, '').replace(/_+/g, '').trim();
        if (n) meta.bp_legal_name = clean(n);
      }
    });
  }
  if (/\b(AMENDMENT|ADDENDUM)\b/.test(all.slice(0, 600))) meta.doc_type = /AMENDMENT/.test(all.slice(0, 600)) ? 'Amendment' : 'Addendum';

  // ---- Section A: Pricing Options
  const pA = findPage(/PRICING OPTIONS/i);
  if (pA > -1){
    meta.found.push('Section A');
    const L = pages[pA];
    L.forEach((l, i) => {
      if (/bonus will be awarded/i.test(l.text)){
        const money = parseMoney(l.text.replace(/\$\s*\./, '$0.'));
        const sentence = clean(l.text + ' ' + (L[i + 1] && !/bonus will be awarded|Option A/i.test(L[i + 1].text) ? L[i + 1].text : ''));
        const cond = sentence.replace(/^A\s*\$\s*[\d.]+\s*\/\s*watt\s*/i, '').replace(/^bonus will be awarded for\s*/i, '');
        const name = /inspection/i.test(sentence) ? 'Inspection bonus' : /schedul/i.test(sentence) ? 'Scheduling bonus' : 'Bonus';
        if (money) money.unit = '$/W';
        add('Bonus', name, money, cond, sentence, pA + 1);
      }
      if (/Option A/i.test(l.text) && /Option B/i.test(l.text)){
        const bx = (l.segs.find(s => /Option B/i.test(s.s)) || {}).x || 300;
        const val = side => {
          const seg = l.segs.find(s => (side === 'A' ? s.x < bx : s.x >= bx) && /^\$?\s*\d*\.\d+$/.test(s.s.trim()));
          if (seg) return Number(seg.s.replace(/[^\d.]/g, ''));
          const m = (side === 'A' ? l.text.split(/Option B/i)[0] : l.text.split(/Option B/i)[1] || '').match(/(\d*\.\d+)/);
          return m ? Number(m[1]) : null;
        };
        // what each option includes = the numbered list under it
        const incl = { A: [], B: [] };
        for (let j = i + 1; j < L.length && j < i + 8; j++){
          if (/ALWAYS SUPPLIES/i.test(L[j].text)) break;
          const a = L[j].segs.filter(s => s.x < bx).map(s => s.s).join(' '), b = L[j].segs.filter(s => s.x >= bx).map(s => s.s).join(' ');
          if (a.trim()) incl.A.push(clean(a.replace(/^\d+\.\s*/, ''))); if (b.trim()) incl.B.push(clean(b.replace(/^\d+\.\s*/, '')));
        }
        ['A', 'B'].forEach(side => {
          const v = val(side);
          add('Install rate', 'Install – Option ' + side, v === null ? null : { amount: v, unit: '$/W' },
            'Includes: ' + (incl[side].join('; ') || 'see Section A') + (v === null ? ' (rate left blank in agreement)' : ''), l.text, pA + 1);
        });
      }
    });
  }

  // ---- Section B: Payment Terms (chosen by initials, which are images, so both are listed)
  const pB = findPage(/Payment Terms/i);
  if (pB > -1 && pages[pB].some(l => /Section B/i.test(l.text))){
    meta.found.push('Section B');
    const L = pages[pB];
    L.forEach((l, i) => {
      const m = l.text.match(/Net\s*(\d+)/i);
      if (m && /Initial/i.test(l.text)){
        const pct = L.slice(i + 1, i + 4).map(x => x.text).join(' ').match(/(\d+)%[\s\S]*?(\d+)%/);
        add('Payment terms', 'Net ' + m[1], { amount: Number(m[1]), unit: 'days' },
          (pct ? 'M1 ' + pct[1] + '% at install complete (photos verified & inspection ready), M2 ' + pct[2] + '% at AHJ passed final inspection. ' : '') + 'Chosen by initials — keep the one that is initialed.',
          l.text + (pct ? ' — ' + pct[0] : ''), pB + 1);
      }
    });
  }

  // ---- Deductions, penalties & service fees (between Section B and the Adder List)
  const pAdd = findPage(/ADDER LIST/i);
  const from = pB > -1 ? pB : (pA > -1 ? pA : -1);
  if (from > -1){
    for (let p = from; p < (pAdd > -1 ? pAdd : pages.length); p++){
      const L = pages[p];
      L.forEach((l, i) => {
        if (!/\$\s*[\d,]+/.test(l.text) || /bonus will be awarded|Option A|Net\s*\d+/i.test(l.text)) return;
        // rebuild the sentence around the amount
        let s = l.text, k = i;
        while (k > 0 && !/[.:]\s*$/.test(L[k - 1].text) && !/^[●○•\d]/.test(L[k].text.trim()) && i - k < 3){ k--; s = L[k].text + ' ' + s; }
        let k2 = i; while (k2 + 1 < L.length && !/[.)]\s*$/.test(L[k2].text) && k2 - i < 2){ k2++; s += ' ' + L[k2].text; }
        s = clean(s.replace(/^.*?Initials:\s*_*\s*/i, '').replace(/^[●○•]\s*/, '').replace(/^\d+\.\s*/, ''));
        const money = parseMoney(s.match(/per day/i) ? s.replace(/\$\s*([\d,.]+)\s*per day/i, '$$$1/day') : s);
        let name = 'Other fee', cat = 'Deduction / chargeback';
        if (/per day/i.test(s)) name = 'Late / missing photos (per day)';
        else if (/no call|no show|failure to arrive/i.test(s)) name = 'No call, no show';
        else if (/deviation/i.test(s)) name = 'Deviation from approved plans';
        else if (/truck roll|service work/i.test(s)) { if (pAdd > -1) return; name = 'Service work / truck roll'; cat = 'Adder / allowance'; }
        if (items.some(x => x.item === name)) return;
        add(cat, name, money, s, s, p + 1);
      });
    }
  }

  // ---- Adder List (table: TASK | PRICE | EACH ADDITIONAL)
  if (pAdd > -1){
    meta.found.push('Adder List');
    let b1 = 280, b2 = 390, pending = null, last = null, stop = false, preNote = null;
    for (let p = pAdd; p < pages.length && !stop; p++){
      for (const l of pages[p]){
        if (/^Docusign Envelope/i.test(l.text) || /^\d{1,2}$/.test(l.text)) continue;
        if (/TASK/.test(l.text) && /PRICE/.test(l.text)){
          const px = (l.segs.find(s => /PRICE/.test(s.s)) || {}).x, ex = (l.segs.find(s => /EACH/.test(s.s)) || {}).x;
          if (px) b1 = px - 25; if (ex) b2 = ex - 15; continue;
        }
        if (/Travel Adder Example|Additional pricing agreements/i.test(l.text)){ stop = true; break; }
        if (/ADDER LIST|adders are expected|before moving forward/i.test(l.text)) continue;
        const task = clean(l.segs.filter(s => s.x < b1).map(s => s.s).join(' '));
        const price = clean(l.segs.filter(s => s.x >= b1 && s.x < b2).map(s => s.s).join(' '));
        const extra = clean(l.segs.filter(s => s.x >= b2).map(s => s.s).join(' '));
        if (!price){
          if (task && task.startsWith('(') && last && Math.abs(last.y - l.y) <= 14 && last.page === p){ last.row.conditions = clean(last.row.conditions + ' ' + task); continue; }
          if (task && !task.startsWith('(')){ pending = { text: task, y: l.y, page: p }; continue; }
          if (extra && !task){ preNote = { text: extra, y: l.y, page: p }; }
          if (extra && last && last.page === p && Math.abs(last.y - l.y) <= 14 && !(preNote && preNote.y === l.y && last.used)){ last.row.conditions = clean(last.row.conditions + ' ' + extra); last.used = true; preNote = null; continue; }
          continue;
        }
        let name = task, note = '';
        if (!name || name.startsWith('(')){ note = name; name = pending && pending.page === p && pending.y - l.y <= 16 ? pending.text : (name || 'Adder'); }
        pending = null;
        if (/main service panel upgrade/i.test(name)) name = 'MPU (Main Service Panel Upgrade)';
        const money = parseMoney(price);
        let cond = note;
        if (preNote && preNote.page === p && preNote.y - l.y <= 14){ cond = clean(preNote.text + ' ' + cond); } preNote = null;
        if (/quote/i.test(price)) cond = clean(cond + ' Quote — price agreed per job');
        if (/base/i.test(price)) cond = clean(cond + ' Base price');
        if (money && money.plus) cond = clean(cond + ' Added on top of the tier above');
        const em = parseMoney(extra);
        if (extra && !em) cond = clean(cond + ' ' + extra);
        const row = { category: 'Adder / allowance', item: clean(name), amount: money ? money.amount : undefined, unit: money ? money.unit : 'other', conditions: cond, source_quote: clean([name, note, price, extra].filter(Boolean).join(' | ')), page: p + 1 };
        items.push(row); last = { row, y: l.y, page: p };
        if (em){
          const ex2 = extra.replace(MONEY_RE, '').trim();
          items.push({ category: 'Adder / allowance', item: clean(name) + ' – each additional', amount: em.amount, unit: em.unit, conditions: clean(ex2), source_quote: row.source_quote, page: p + 1 });
        }
      }
    }
  }

  // ---- Not our template (addendum, amendment, other): general scan of $ amounts
  if (!meta.found.length){
    pages.forEach((L, p) => L.forEach((l, i) => {
      if (!/\$\s*\.?\d/.test(l.text)) return;
      const s = clean([L[i - 1] && L[i - 1].text, l.text, L[i + 1] && L[i + 1].text].filter(Boolean).join(' '));
      const money = parseMoney(l.text.replace(/\$\s*\./, '$0.'));
      const cat = /bonus/i.test(s) ? 'Bonus' : /install/i.test(s) && money && money.unit === '$/W' ? 'Install rate' : /deduct|penalt|chargeback/i.test(s) ? 'Deduction / chargeback' : 'Other';
      add(cat, clean(l.text.replace(MONEY_RE, '').replace(/[_|]+/g, ' ')).slice(0, 60) || 'Amount', money, '', s, p + 1);
    }));
  }

  const n = k => items.filter(x => x.category === k).length;
  meta.summary = meta.found.length
    ? 'Read ' + meta.found.join(', ') + ': ' + n('Install rate') + ' install rate(s), ' + n('Bonus') + ' bonus(es), ' + n('Payment terms') + ' payment term(s), ' + n('Deduction / chargeback') + ' deduction(s), ' + n('Adder / allowance') + ' adder(s).'
    : 'Not the standard BP Agreement layout — listed every $ amount found for review.';
  return { ...meta, items };
}

/* Read one agreement in the browser and save the rows */
async function readAgreement(fileId, folderId){
  try {
    const f = await sapi('pricingFileData', { fileId });
    const bin = atob(f.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const out = parseAgreement(await pdfLines(u));
    return await sapi('pricingSave', { fileId, folderId, out });
  } catch(e){
    sapi('pricingError', { fileId, folderId, error: e.message }).catch(()=>{});
    throw e;
  }
}

/* ----- BP Pricing (reads the BP Agreement template, no AI) ----- */
const P = { data: readCache('bpf_pricing'), fresh: false, q: '', status: '', currentOnly: false };
async function loadPricing(){ const d = await sapi('pricingBoot'); P.data = d; store.set('bpf_pricing', JSON.stringify(d)); return d; }
function setPricing(d){ P.data = d; store.set('bpf_pricing', JSON.stringify(d)); if (S.tab === 'pricing') drawPricing(); }

const tidy = t => String(t || '').replace(/_{3,}/g, ' ').replace(/\s{2,}/g, ' ').replace(/\s+([;,.])/g, '$1').replace(/;\s*$/, '').trim();
const fmtAmt = (a, u) => {
  if (a === null || a === undefined || a === '') return '—';
  const n = Number(a);
  if (u === '%') return n + '%';
  const s = '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
  if (u === 'days') return 'Net ' + n;
  return u === '$/W' ? s + '/W' : u === '$ per day' ? s + '/day' : u === '$ per foot' ? s + '/ft' : u === '$ per panel' ? s + '/panel' : s;
};

function filteredPricing(){
  const q = P.q.toLowerCase();
  return (P.data.items || []).filter(i =>
    (!q || [i.bpName, i.item, i.category, i.conditions].join(' ').toLowerCase().includes(q)) &&
    (!P.status || i.status === P.status) && (!P.currentOnly || i.current));
}

function drawPricing(){
  if (!$('#pList')) return;
  const d = P.data;
  $('#pSheet').href = d.sheetUrl || '#';
  const list = filteredPricing();
  const review = (d.items || []).filter(i => i.status === 'Needs review').length;
  const bps = new Set((d.items || []).map(i => i.folderId)).size;
  $('#pStats').innerHTML = `${bps} BP${bps === 1 ? '' : 's'} · ${(d.items || []).length} price items · ${(d.docs || []).length} documents read${review ? ` · ${review} not double-checked yet (optional)` : ''}`;
  if (!list.length){
    $('#pList').innerHTML = `<div class="card center">${(d.items || []).length ? 'No matches.' : 'No pricing yet. Click <b>＋ Add agreements</b> to read your BP agreements.'}</div>`;
    return;
  }
  const groups = {};
  list.forEach(i => { (groups[i.folderId] = groups[i.folderId] || { bp: i.bpName, items: [] }).items.push(i); });
  const order = { 'Install rate': 1, 'Bonus': 2, 'Payment terms': 3, 'Adder / allowance': 4, 'Deduction / chargeback': 5, 'Minimum': 6, 'Override': 7, 'Other': 8 };
  $('#pList').innerHTML = Object.keys(groups).sort((a, b) => groups[a].bp.localeCompare(groups[b].bp)).map(fid => {
    const g = groups[fid];
    g.items.sort((a, b) => (order[a.category] || 9) - (order[b.category] || 9) || String(a.item).localeCompare(b.item) || (b.effectiveDate || '').localeCompare(a.effectiveDate || ''));
    const docs = (d.docs || []).filter(x => x.folderId === fid);
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap">
        <h3>${esc(g.bp)}</h3>
        <span class="muted">${g.items.length} item${g.items.length === 1 ? '' : 's'} · <a href="#" data-addfor="${esc(fid)}">＋ add price</a></span>
      </div>
      ${docs.length ? `<details style="margin:6px 0 4px"><summary class="muted" style="cursor:pointer">${docs.length} document${docs.length === 1 ? '' : 's'} read</summary>
        ${docs.map(x => `<div class="kv" style="margin:6px 0">${x.status === 'Error' ? chip('Needs Redo').replace('Needs redo', 'Error') : ''} <a href="${esc(x.url)}" target="_blank" rel="noopener">📄 ${esc(x.fileName)}</a>
          ${x.docType ? `<span class="muted">· ${esc(x.docType)}${x.docDate ? ' · ' + esc(x.docDate) : ''}</span>` : ''}
          ${x.summary ? `<div class="muted">${esc(x.summary)}</div>` : ''}${x.error ? `<div style="color:var(--bad);font-size:13px">${esc(x.error)}</div>` : ''}</div>`).join('')}</details>` : ''}
      <div class="ptw"><table class="ptable"><thead><tr><th>Item</th><th>Amount</th><th>Details</th><th>Effective</th><th>Status</th></tr></thead><tbody>
      ${g.items.map(i => `<tr class="${i.current ? '' : (i.status === 'Verified' ? 'old' : '')}">
        <td><b>${esc(i.item)}</b><div class="muted">${esc(i.category)}</div></td>
        <td class="amt">${fmtAmt(i.amount, i.unit)}${i.unit === 'other' || i.unit === '$ per job' ? `<div class="muted">${esc(i.unit)}</div>` : ''}</td>
        <td>${i.quote ? `<div>${esc(tidy(i.quote))}</div>${tidy(i.conditions) ? `<div class="quote">${esc(tidy(i.conditions))}</div>` : ''}` : esc(tidy(i.conditions) || '—')}${i.sourceUrl ? `<div class="quote" style="font-style:normal"><a href="${esc(i.sourceUrl)}" target="_blank" rel="noopener">source</a></div>` : ''}</td>
        <td style="white-space:nowrap">${esc(i.effectiveDate || '—')}</td>
        <td>${i.status === 'Verified' ? chip('Approved').replace('Approved', 'Verified') : chip('Missing').replace('Missing', 'Needs review')}${i.current ? '<div class="muted" style="margin-top:3px">● current</div>' : (i.status === 'Verified' ? '<div class="muted" style="margin-top:3px">older</div>' : '')}<div class="pacts">${i.status !== 'Verified' ? `<button class="btn sm ok" data-verify="${esc(i.id)}">✓ Verify</button> ` : ''}<button class="btn sm ghost" data-edit="${esc(i.id)}">Edit</button></div></td>

      </tr>`).join('')}</tbody></table></div></div>`;
  }).join('');
  $('#pList').querySelectorAll('[data-verify]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { setPricing(await sapi('pricingUpdate', { itemId: b.dataset.verify, verify: true })); toast('Verified ✓'); }
    catch(e){ toast(e.message, true); b.disabled = false; }
  });
  $('#pList').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openPriceEdit(P.data.items.find(i => i.id === b.dataset.edit)));
  $('#pList').querySelectorAll('[data-addfor]').forEach(a => a.onclick = e => { e.preventDefault(); openPriceEdit(null, a.dataset.addfor); });
}

function openDrawer(title, sub, body){
  drawer.innerHTML = `<header><div><h2>${esc(title)}</h2>${sub ? `<div style="font-size:13px;color:#ccc;margin-top:3px">${esc(sub)}</div>` : ''}</div><button class="x" aria-label="Close">×</button></header><div class="body">${body}</div>`;
  drawer.querySelector('.x').onclick = closeDrawer;
  drawer.classList.add('open'); shade.classList.add('open'); drawer.scrollTop = 0;
}

function folderOptions(sel){
  return (S.folders || []).map(f => `<option value="${esc(f.id)}" ${f.id === sel ? 'selected' : ''}>${esc(f.name)}</option>`).join('');
}

/* Add / edit one price row */
function openPriceEdit(item, folderId){
  const d = P.data, isNew = !item;
  if (isNew && !S.folders){ toast('Loading BP folders…'); loadFolders().then(() => openPriceEdit(null, folderId)); return; }
  const v = item || { category: 'Install rate', unit: '$/W', amount: '', item: '', conditions: '', effectiveDate: '', notes: '' };
  openDrawer(isNew ? 'Add a price' : 'Edit price', isNew ? 'Added manually rows are saved as Verified' : item.bpName, `
    <form id="pf" class="card">
      ${isNew ? `<div class="mb"><label class="f">Build Partner *</label><select id="pfBp" required><option value="">Choose BP folder…</option>${folderOptions(folderId)}</select></div>` : ''}
      <div class="row mb"><div><label class="f">Category</label><select id="pfCat">${d.categories.map(c => `<option ${c === v.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label class="f">Item *</label><input type="text" id="pfItem" value="${esc(v.item)}" placeholder="e.g. Install, MPU" required></div></div>
      <div class="row mb"><div><label class="f">Amount</label><input type="text" inputmode="decimal" id="pfAmt" value="${v.amount === null || v.amount === undefined ? '' : esc(v.amount)}" placeholder="e.g. 0.62 or 3500"></div>
        <div><label class="f">Unit</label><select id="pfUnit">${d.units.map(u => `<option ${u === v.unit ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div></div>
      <div class="mb"><label class="f">Conditions</label><textarea id="pfCond" rows="2" placeholder="e.g. up to, only in Illinois, minimum 5 kW">${esc(v.conditions || '')}</textarea></div>
      <div class="row mb"><div><label class="f">Effective date</label><input type="text" id="pfEff" value="${esc(v.effectiveDate || '')}" placeholder="YYYY-MM-DD"></div>
        <div><label class="f">Notes (staff)</label><input type="text" id="pfNotes" value="${esc(v.notes || '')}"></div></div>
      ${item && item.quote ? `<div class="quote mb" style="font-size:13.5px">From the document: “${esc(item.quote)}”${item.sourceUrl ? ` <a href="${esc(item.sourceUrl)}" target="_blank" rel="noopener">open ${esc(item.sourceFile)}</a>` : ''}</div>` : ''}
      ${item && item.reviewedBy ? `<p class="muted">Verified by ${esc(item.reviewedBy)} · ${fmtDate(item.reviewedAt)}</p>` : ''}
      <div class="footer-acts">
        ${isNew ? `<button class="btn" id="pfSave">Add price</button>` : `
          ${item.status !== 'Verified' ? `<button class="btn ok" id="pfSaveV" type="button">Save & verify</button>` : ''}
          <button class="btn ${item.status === 'Verified' ? '' : 'ghost'}" id="pfSave">Save</button>
          ${item.status === 'Verified' ? `<button class="btn ghost" id="pfUnv" type="button">Mark as needs review</button>` : ''}
          <button class="btn bad" id="pfDel" type="button" style="margin-left:auto">Delete</button>`}
      </div>
    </form>`);
  const amtOk = () => { const a = $('#pfAmt').value.trim().replace(/[$,]/g, ''); if (a && isNaN(Number(a))) { toast('Amount must be a number, e.g. 0.62', true); return null; } return a; };
  const fields = a => ({ Category: $('#pfCat').value, Item: $('#pfItem').value.trim(), Amount: a, Unit: $('#pfUnit').value, Conditions: $('#pfCond').value.trim(), 'Effective Date': $('#pfEff').value.trim(), Notes: $('#pfNotes').value.trim() });
  const run = async (btn, call, msg) => { btn.disabled = true; try { setPricing(await call()); toast(msg); closeDrawer(); } catch(e){ toast(e.message, true); btn.disabled = false; } };
  $('#pf').onsubmit = e => {
    e.preventDefault(); const a = amtOk(); if (a === null) return;
    if (isNew){
      if (!$('#pfBp').value) return toast('Choose the BP.', true);
      const f = fields(a);
      run($('#pfSave'), () => sapi('pricingAdd', { folderId: $('#pfBp').value, category: f.Category, item: f.Item, amount: a, unit: f.Unit, conditions: f.Conditions, effectiveDate: f['Effective Date'], notes: f.Notes }), 'Price added');
    } else run($('#pfSave'), () => sapi('pricingUpdate', { itemId: item.id, fields: fields(a) }), 'Saved');
  };
  if (!isNew){
    const sv = $('#pfSaveV'); if (sv) sv.onclick = () => { const a = amtOk(); if (a !== null) run(sv, () => sapi('pricingUpdate', { itemId: item.id, fields: fields(a), verify: true }), 'Saved & verified ✓'); };
    const un = $('#pfUnv'); if (un) un.onclick = () => run(un, () => sapi('pricingUpdate', { itemId: item.id, unverify: true }), 'Marked as needs review');
    $('#pfDel').onclick = () => confirm(`Delete "${item.item}" for ${item.bpName}?`) && run($('#pfDel'), () => sapi('pricingDelete', { itemId: item.id }), 'Deleted');
  }
}

/* Pick BP folders → find agreements → read them one by one */
function openAddAgreements(){
  if (!S.folders){ toast('Loading BP folders…'); loadFolders().then(openAddAgreements); return; }
  const picked = new Set();
  openDrawer('Add agreements', 'Reads Section A, Section B, deductions and the Adder List', `
    <div class="card"><b>1. Choose the active BPs</b>
      <input type="search" id="afq" placeholder="Search BP folders…" style="margin:10px 0 8px">
      <div id="afList" style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap">
        <span class="muted" id="afCount">0 selected</span>
        <button class="btn sm" id="afFind" disabled>Find agreements</button></div>
    </div>
    <div id="afFiles"></div>
    <div class="card"><b>Or upload a new agreement</b>
      <p class="muted" style="margin:4px 0 10px">It's saved into that BP's folder, then read.</p>
      <select id="auBp" class="mb"><option value="">Choose BP folder…</option>${folderOptions()}</select>
      <label class="drop"><input type="file" id="auFile" accept=".pdf,application/pdf">📎 Choose a PDF</label>
      <div class="prog" id="auProg"></div>
    </div>`);
  const drawList = () => {
    const q = $('#afq').value.toLowerCase();
    $('#afList').innerHTML = S.folders.filter(f => !q || f.name.toLowerCase().includes(q)).map(f =>
      `<label class="doc-ck" style="padding:6px 4px"><input type="checkbox" value="${esc(f.id)}" ${picked.has(f.id) ? 'checked' : ''}><div>${esc(f.name)}</div></label>`).join('') || '<p class="muted">No folders match.</p>';
    $('#afList').querySelectorAll('input').forEach(c => c.onchange = () => { c.checked ? picked.add(c.value) : picked.delete(c.value); $('#afCount').textContent = picked.size + ' selected'; $('#afFind').disabled = !picked.size; });
  };
  $('#afq').oninput = drawList; drawList();
  $('#afFind').onclick = async () => {
    const b = $('#afFind'); b.disabled = true; b.textContent = 'Looking…';
    try { renderAgreementFiles(await sapi('pricingFiles', { folderIds: [...picked] })); }
    catch(e){ toast(e.message, true); }
    b.disabled = false; b.textContent = 'Find agreements';
  };
  $('#auFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!$('#auBp').value){ toast('Choose the BP folder first.', true); e.target.value = ''; return; }
    if (f.size > 20 * 1024 * 1024){ toast('PDF is larger than 20 MB.', true); return; }
    $('#auProg').innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px"></span> Uploading and reading…';
    try {
      const up = await sapi('pricingUpload', { folderId: $('#auBp').value, fileName: f.name, mimeType: f.type, data: await readB64(f) });
      const r = await readAgreement(up.fileId, $('#auBp').value);
      $('#auProg').innerHTML = `✅ Read <b>${esc(r.fileName)}</b>: ${r.count} price item${r.count === 1 ? '' : 's'} found. ${esc(r.summary || '')}`;
      setPricing(await loadPricing());
    } catch(err){ $('#auProg').innerHTML = `<span style="color:var(--bad)">❌ ${esc(err.message)}</span>`; }
    e.target.value = '';
  };
}

function renderAgreementFiles(groups){
  const box = $('#afFiles');
  const total = groups.reduce((n, g) => n + g.files.length, 0);
  box.innerHTML = `<div class="card"><b>2. Pick the agreements to read</b>
    <p class="muted" style="margin:4px 0 8px">Files that look like agreements, amendments or rate sheets are pre-ticked. Already-read files are unticked.</p>
    ${total ? groups.map(g => `<div style="margin-top:10px"><b style="font-size:14px">${esc(g.bpName)}</b>
      ${g.files.length ? g.files.map(f => `<label class="doc-ck" style="padding:6px 0"><input type="checkbox" data-file="${esc(f.id)}" data-folder="${esc(g.folderId)}" data-name="${esc(f.name)}" ${f.ok ? '' : 'disabled'} ${f.ok && f.likely && f.status !== 'Done' ? 'checked' : ''}>
        <div>${esc(f.name)} ${f.status === 'Done' ? '<span class="chip c-ok">read</span>' : ''}${f.status === 'Error' ? '<span class="chip c-redo">error</span>' : ''}${f.ok ? '' : '<small>Not a PDF — save it as PDF to include it</small>'}<div class="afst muted" id="st-${esc(f.id)}"></div></div></label>`).join('')
        : '<p class="muted">No files in this folder.</p>'}</div>`).join('') : '<p class="muted">No files found.</p>'}
    <div style="margin-top:12px"><button class="btn" id="afRun">Read pricing</button> <span class="muted" id="afRunInfo"></span></div></div>`;
  const run = $('#afRun');
  const count = () => { const n = box.querySelectorAll('input[data-file]:checked').length; run.textContent = `Read pricing from ${n} file${n === 1 ? '' : 's'}`; run.disabled = !n; };
  box.querySelectorAll('input[data-file]').forEach(c => c.onchange = count); count();
  run.onclick = async () => {
    const list = [...box.querySelectorAll('input[data-file]:checked')];
    run.disabled = true; box.querySelectorAll('input[data-file]').forEach(c => c.disabled = true);
    let ok = 0, found = 0;
    for (let n = 0; n < list.length; n++){
      const c = list[n], st = document.getElementById('st-' + c.dataset.file);
      $('#afRunInfo').textContent = `Reading ${n + 1} of ${list.length}…`;
      st.innerHTML = '<span class="spin" style="width:12px;height:12px;border-width:2px"></span> reading…';
      try {
        const r = await readAgreement(c.dataset.file, c.dataset.folder);
        ok++; found += r.count;
        st.innerHTML = `<span style="color:var(--ok)">✅ ${r.count} item${r.count === 1 ? '' : 's'}${r.docType ? ' · ' + esc(r.docType) : ''}</span>`;
      } catch(e){ st.innerHTML = `<span style="color:var(--bad)">❌ ${esc(e.message)}</span>`; }
    }
    $('#afRunInfo').textContent = `Done: ${ok} of ${list.length} read, ${found} price items found. Review them on the pricing page.`;
    try { setPricing(await loadPricing()); } catch(e){}
    toast('Finished reading');
  };
}

function downloadPricingCsv(){
  const rows = filteredPricing();
  const head = ['BP', 'Category', 'Item', 'Amount', 'Unit', 'Conditions', 'Effective Date', 'Status', 'Current', 'Source File', 'Source Quote'];
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [head.join(',')].concat(rows.map(i => [i.bpName, i.category, i.item, i.amount ?? '', i.unit, i.conditions, i.effectiveDate, i.status, i.current ? 'Yes' : '', i.sourceFile, i.quote].map(q).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'BP-pricing-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ----- Request drawer ----- */
const drawer = $('#drawer'), shade = $('#shade');
shade.onclick = closeDrawer;
function closeDrawer(){ drawer.classList.remove('open'); shade.classList.remove('open'); S.open = null; }

async function openReq(id){
  S.open = id;
  drawer.innerHTML = '<div class="center" style="padding-top:80px"><span class="spin"></span></div>';
  drawer.classList.add('open'); shade.classList.add('open');
  try { drawReq(await sapi('getRequestAdmin', { id })); }
  catch(e){ drawer.innerHTML = `<div class="body"><p>${esc(e.message)}</p></div>`; }
}

function drawReq(d){
  const outstanding = d.items.filter(i => i.status==='Missing' || i.status==='Needs Redo').length;
  const closed = d.status === 'Closed';
  drawer.innerHTML = `<header><div><h2>${esc(d.bpName)}</h2><div style="font-size:13px;color:#ccc;margin-top:3px">${esc(d.id)}</div></div><button class="x" aria-label="Close">×</button></header>
  <div class="body">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Details</b>${chip(d.status)}</div>
      <p class="kv">👤 ${esc(d.contact||'—')} · <a href="mailto:${esc(d.email)}">${esc(d.email)}</a></p>
      <p class="kv">📁 <a href="${esc(d.folderUrl)}" target="_blank" rel="noopener">${esc(d.folderName)}</a></p>
      <p class="kv">📍 ${esc(d.states||'No states selected')} · LightReach: ${esc(d.lightreach)} · WC: ${esc(d.wcMode)}</p>
      <p class="kv">✉️ Last emailed ${fmtDate(d.lastEmailed)} · ${d.followUps} follow-up${d.followUps===1?'':'s'}</p>
      ${d.notes ? `<p class="kv">📝 ${esc(d.notes)}</p>` : ''}
      <div class="footer-acts" style="margin-top:12px">
        ${!closed ? `<button class="btn sm" id="fuBtn" ${outstanding?'':'disabled'}>Send follow-up${outstanding?` (${outstanding})`:''}</button>` : ''}
        ${!closed && !d.lastEmailed ? `<button class="btn sm ghost" id="rsBtn">Send request email</button>` : ''}
        ${!closed && d.lastEmailed ? `<button class="btn sm ghost" id="rsBtn" ${outstanding?'':'disabled'}>Resend original</button>` : ''}
        ${!closed ? `<button class="btn sm ghost" id="adBtn">＋ Add documents</button>` : ''}
        <button class="btn sm ghost" id="cpBtn">Copy BP link</button>
        <button class="btn sm ghost" id="clBtn">${closed ? 'Reopen' : 'Close request'}</button>
      </div>
    </div>
    <div class="card" id="addBox" hidden></div>
    <div class="card"><b style="display:block;margin-bottom:10px">Documents</b>
      ${d.items.map(i => `<div class="di">
        <div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(i.label)}</b>${chip(i.status)}</div>
        ${i.note ? `<div class="note" style="margin:6px 0 0">${esc(i.note)}</div>` : ''}
        ${i.files.length ? `<div class="files" style="margin-top:6px">${i.files.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">📄 ${esc(f.name)}</a>`).join('')}</div>` : ''}
        ${!closed ? `<div class="acts">
          ${i.status!=='Approved' && i.files.length ? `<button class="btn sm ok" data-a="Approved" data-k="${esc(i.key)}">Approve</button>` : ''}
          ${i.status==='Submitted' || i.status==='Approved' ? `<button class="btn sm bad" data-a="Needs Redo" data-k="${esc(i.key)}">Needs redo</button>` : ''}
          ${i.status==='Missing' ? `<button class="btn sm ghost" data-a="Approved" data-k="${esc(i.key)}">Mark on file</button>` : ''}
        </div>` : ''}
      </div>`).join('')}
    </div>
  </div>`;
  drawer.querySelector('.x').onclick = closeDrawer;
  const act = async (btn, fn, msg) => {
    btn.disabled = true;
    try {
      const nd = await fn(); toast(msg); drawReq(nd);
      loadReqs().then(() => { if (S.tab==='list') listPane(); }).catch(()=>{}); // refresh list in the background
    } catch(e){ toast(e.message, true); btn.disabled = false; }
  };
  const fu = $('#fuBtn'); if (fu) fu.onclick = () => confirm(`Send a follow-up email to ${d.email} listing ${outstanding} outstanding item${outstanding>1?'s':''}?`) && act(fu, () => sapi('followUp', { id:d.id }), 'Follow-up sent 📨');
  const rs = $('#rsBtn'); if (rs) rs.onclick = () => confirm(`Send the request email to ${d.email}?`) && act(rs, () => sapi('resend', { id:d.id }), 'Request email sent 📨');
  const ad = $('#adBtn'); if (ad) ad.onclick = () => {
    const box = $('#addBox'); if (!box.hidden) { box.hidden = true; return; }
    const have = d.items.map(i => i.key);
    const left = (S.catalog||[]).filter(c => have.indexOf(c.key) < 0);
    const groups = [...new Set(left.map(c => c.group || 'Other'))];
    box.innerHTML = `<b style="display:block;margin-bottom:4px">Add documents to this request</b>
      <p class="kv" style="margin-bottom:10px">Forgot something? Pick it below. The BP uses the same link, and nothing they already uploaded is lost.</p>
      ${left.length ? groups.map(g => `<div style="margin:8px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut,#888)">${esc(g)}</div>` +
        left.filter(c => (c.group||'Other')===g).map(c => `<label style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer"><input type="checkbox" value="${esc(c.key)}" style="margin-top:3px"> <span>${esc(c.label)}</span></label>`).join('')).join('')
        : '<p class="kv">Every document is already on this request.</p>'}
      ${left.length ? `<label style="display:flex;gap:8px;align-items:center;margin:12px 0 10px;padding-top:10px;border-top:1px solid var(--line)"><input type="checkbox" id="adNotify" checked> Email ${esc(d.email)} about the new document(s)</label>
      <div class="footer-acts"><button class="btn sm" id="adGo">Add to request</button><button class="btn sm ghost" id="adX">Cancel</button></div>` : ''}`;
    box.hidden = false; box.scrollIntoView({ behavior:'smooth', block:'nearest' });
    const x = $('#adX'); if (x) x.onclick = () => box.hidden = true;
    const go = $('#adGo'); if (go) go.onclick = () => {
      const keys = [...box.querySelectorAll('input[type=checkbox][value]:checked')].map(i => i.value);
      if (!keys.length) return toast('Pick at least one document', true);
      const notify = $('#adNotify').checked;
      act(go, () => sapi('addItems', { id:d.id, items:keys, notify }), keys.length + ' document' + (keys.length>1?'s':'') + ' added' + (notify ? ' and BP emailed 📨' : ''));
    };
  };
  $('#cpBtn').onclick = () => { navigator.clipboard.writeText(d.link).then(() => toast('BP link copied'), () => prompt('Copy this link:', d.link)); };
  $('#clBtn').onclick = e => act(e.target, () => sapi(closed ? 'reopenRequest' : 'closeRequest', { id:d.id }), closed ? 'Request reopened' : 'Request closed');
  drawer.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    let note = '';
    if (b.dataset.a === 'Needs Redo') { note = prompt('What needs fixing? (The BP will see this note on their page and in the follow-up email.)'); if (note === null) return; }
    act(b, () => sapi('setItemStatus', { id:d.id, itemKey:b.dataset.k, status:b.dataset.a, note }), b.dataset.a==='Approved' ? 'Marked approved' : 'Marked as needs redo');
  });
}
