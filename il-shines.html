<title>GOODPWR · Illinois Shines Designee Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22GOODPWR%20IL%20Designee%20Compliance%22%3E%20%3Cg%20fill%3D%22%23C9995A%22%3E%20%3Cpath%20d%3D%22M32%201l3%209h-6z%22/%3E%3Cpath%20d%3D%22M32%2063l-3-9h6z%22/%3E%3Cpath%20d%3D%22M1%2032l9-3v6z%22/%3E%3Cpath%20d%3D%22M63%2032l-9%203v-6z%22/%3E%20%3Cpath%20d%3D%22M10.1%2010.1l8.5%204.3-4.2%204.2z%22/%3E%3Cpath%20d%3D%22M53.9%2053.9l-8.5-4.3%204.2-4.2z%22/%3E%3Cpath%20d%3D%22M53.9%2010.1l-4.3%208.5-4.2-4.2z%22/%3E%3Cpath%20d%3D%22M10.1%2053.9l4.3-8.5%204.2%204.2z%22/%3E%20%3Cpath%20d%3D%22M20.1%203.3l5.6%207.6-5%202z%22%20opacity%3D%22.75%22/%3E%3Cpath%20d%3D%22M43.9%203.3l-.6%209.6-5-2z%22%20opacity%3D%22.75%22/%3E%20%3Cpath%20d%3D%22M60.7%2020.1l-7.6%205.6-2-5z%22%20opacity%3D%22.75%22/%3E%3Cpath%20d%3D%22M60.7%2043.9l-9.6-.6%202-5z%22%20opacity%3D%22.75%22/%3E%20%3Cpath%20d%3D%22M43.9%2060.7l-5.6-7.6%205-2z%22%20opacity%3D%22.75%22/%3E%3Cpath%20d%3D%22M20.1%2060.7l.6-9.6%205%202z%22%20opacity%3D%22.75%22/%3E%20%3Cpath%20d%3D%22M3.3%2043.9l7.6-5.6%202%205z%22%20opacity%3D%22.75%22/%3E%3Cpath%20d%3D%22M3.3%2020.1l9.6.6-2%205z%22%20opacity%3D%22.75%22/%3E%20%3C/g%3E%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2220%22%20fill%3D%22%23C9995A%22/%3E%20%3Cpath%20d%3D%22M32%2015.5l12.5%204.6v9.6c0%208.4-5.3%2014.6-12.5%2018.3-7.2-3.7-12.5-9.9-12.5-18.3v-9.6z%22%20fill%3D%22%232B2824%22/%3E%20%3Cpath%20d%3D%22M25.2%2031.6l4.9%204.9%209-9.6%22%20fill%3D%22none%22%20stroke%3D%22%23C9995A%22%20stroke-width%3D%223.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%20%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2824; --ink-2:#413c35; --paper:#f2ecdf; --card:#fffcf6; --line:#e3dac6; --line-2:#cfc3a8;
  --muted:#6b665a; --sun:#c9995a; --sun-dark:#b0824a; --sun-soft:#f5e8ce; --bone:#d6c6a5; --steel:#8a8d8f;
  --ok:#1f7a4d; --ok-soft:#dcf1e4; --warn:#9a5b00; --warn-soft:#fdebc8;
  --bad:#b42318; --bad-soft:#fde2df; --info:#2453a6; --info-soft:#e3ebfa; --mute:#5f5d57; --mute-soft:#ecebe6;
  --r:12px; --shadow:0 1px 2px rgba(27,27,25,.06),0 6px 20px rgba(27,27,25,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--info)}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12.5px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px}

/* top bar */
.top{background:var(--ink);color:#fff;border-bottom:4px solid var(--sun)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;width:auto}
.emblem{width:30px;height:30px;flex:none;display:block}
.gplogo{height:44px;width:auto;display:block;flex:none}
.ilmark{display:flex;align-items:center;gap:8px;border-left:1px solid #4d473f;padding-left:12px;font-size:12px;font-weight:600;color:var(--bone);line-height:1.25;min-width:0}
.ilmark span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cobrand{display:flex;align-items:center;gap:16px;background:var(--ink);color:#f2ecdf;border-radius:14px;padding:14px 18px;margin-bottom:18px;border-bottom:4px solid var(--sun)}
.cobrand .gplogo{height:86px}
.cobrand .who{font-family:Archivo,Inter,system-ui,sans-serif;font-weight:900;font-size:20px;color:#fff;letter-spacing:.01em}
.cobrand .who b{color:var(--sun)}
.cobrand .av{font-size:12.5px;color:var(--bone);margin-top:2px}
.cobrand .il{margin-left:auto;display:flex;align-items:center;gap:10px;text-align:right;font-size:12.5px;color:var(--bone);font-weight:600;line-height:1.3}
.cobrand .il .emblem{width:46px;height:46px}
.login .gplogo{height:92px;margin:0 auto 6px}
.login .lock{flex-direction:column;gap:4px}
.login-il{display:flex;justify-content:center;margin-top:10px}
.login-il .ilmark{border-left:0;padding-left:0;color:var(--muted)}
@media(max-width:560px){.cobrand{flex-wrap:wrap}.cobrand .il{margin-left:0;text-align:left;width:100%}.cobrand .gplogo{height:70px}.top .ilmark span{display:none}}
.login .emblem{width:26px;height:26px}
.lock{display:flex;align-items:center;gap:10px}
.lock .tag{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-family:Inter,sans-serif}
.top .lock .tag{display:none}
.mark{font-family:Archivo,Inter,system-ui,sans-serif;font-weight:900;font-size:20px;letter-spacing:.02em}
.mark b{color:var(--sun)}
.login .mark b{color:var(--ink);background:var(--sun);padding:0 4px;border-radius:3px}
.brand .sub{font-size:12px;color:#d9d3c2;border-left:1px solid #4a4943;padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top .who{font-size:12.5px;color:#c9c7bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.btn.sun:hover{background:var(--sun-dark);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--mute-soft)}
.btn.dark-ghost{background:transparent;border-color:#4a4943;color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
.in-f,select.in-f,textarea.in-f{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:9px 11px;outline:none;min-height:40px}
.in-f:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(201,153,90,.45)}
textarea.in-f{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)}
.t-mute{background:var(--mute-soft);color:var(--mute)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head-row h1{font-size:26px;font-weight:800}
.deadlines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.dl{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dl .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dl .date{font-family:Archivo,Inter,system-ui,sans-serif;font-size:20px;font-weight:800}
.dl{border-left:6px solid var(--sun)}
.dl .days{font-family:Archivo,Inter,system-ui,sans-serif;font-weight:900;font-size:30px;line-height:1;text-align:right}
.dl .days small{display:block;font-family:Inter;font-size:11.5px;font-weight:600;color:var(--muted)}
.dl.urgent .days{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat{padding:12px 14px;cursor:pointer;transition:border-color .15s}
.stat:hover{border-color:var(--ink)}
.stat.on{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--sun)}
.stat .n{font-family:Archivo,Inter,system-ui,sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.deadlines{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1;min-width:200px}
.toolbar select{width:auto;min-width:170px}

/* partner list */
.list{overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(180px,1.6fr) 96px repeat(5,minmax(80px,.7fr)) minmax(120px,1fr) 108px;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.lrow:hover{background:#fffaea}
.lrow.lh{cursor:default;background:#2B2824;color:#f4efe2;border-top:0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#d9d3c2}
.lrow.lh:hover{background:#2B2824}
.co{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-lbl{display:none}
.due{color:var(--bad);font-weight:700}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
@media(max-width:900px){
  .lrow.lh{display:none}
  .lrow{grid-template-columns:1fr 1fr;gap:8px 12px}
  .lrow .c-co{grid-column:1/-1}
  .cell-lbl{display:block;font-size:11px;color:var(--muted);font-weight:600}
}

/* layer: drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--paper);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.dh{padding:18px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font-size:21px;font-weight:800}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.x{margin-left:auto;border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.dbody{flex:1;overflow-y:auto;padding:16px 20px 24px}
.df{padding:12px 20px;background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.sec h3{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.item{padding:12px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.item-name{font-weight:700;font-size:13.5px}
.item-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.file-line{font-size:12.5px;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.file-line a{word-break:break-all}
.uplink{color:var(--info);cursor:pointer;font-weight:600}
.act{font-size:12.5px;border-left:2px solid var(--line-2);padding:0 0 10px 12px;margin-left:4px}
.act b{font-weight:600}
.modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--paper);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{padding:18px 20px;display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:19px;font-weight:800}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;display:flex;justify-content:flex-end;gap:10px;background:#fff;border-top:1px solid var(--line)}
.addrow{display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1.3fr 32px;gap:8px;margin-bottom:8px;align-items:center}
.addrow select.need{border-color:var(--warn);background:var(--warn-soft)}
.modal.wide{width:min(900px,calc(100% - 32px))}
.folderbox{border:1px solid var(--line-2);border-radius:10px;padding:12px;background:#fffbee}
.folderbox.ok{border-color:#a9d9bd;background:var(--ok-soft)}
.folderbox.warn{border-color:#f0cf8f;background:var(--warn-soft)}
.path{font-size:12.5px;margin-top:6px;word-break:break-word}
@media(max-width:560px){.addrow{grid-template-columns:1fr;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;cursor:pointer;margin-bottom:8px}
.opt input{margin-top:3px;accent-color:var(--ink)}
.opt b{display:block}

/* login */
.center{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login{width:min(420px,100%);padding:28px}
.login .mark{color:var(--ink);font-size:26px}
.login h1{font-size:20px;margin:14px 0 4px}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:9px;font-size:13px;font-weight:500;margin-top:12px}
.note{background:var(--sun-soft);border:1px solid var(--sun);padding:12px 14px;border-radius:10px;font-size:13.5px}

/* partner page */
.pwrap{max-width:760px;margin:0 auto;padding:28px 16px 80px}
.hero h1{font-size:28px;font-weight:900;line-height:1.15}
.hero .co-name{font-size:15px;color:var(--muted);margin-top:6px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 6px}
.progress i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .4s}
.pdl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pdl .pill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.pdl .pill b{font-family:Archivo,Inter,system-ui,sans-serif}
.step-card{padding:18px 20px;margin-top:16px}
.step-card h2{font-size:17px;font-weight:800;display:flex;gap:10px;align-items:center}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft);display:inline-grid;place-items:center;font-family:Archivo,Inter,system-ui,sans-serif;font-weight:900;font-size:14px;flex:none}
.step-card.done .num{background:var(--ok);color:#fff}
.step-card p{margin:8px 0 0}
.step-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.drop{margin-top:12px;border:1.5px dashed var(--line-2);border-radius:10px;padding:14px;background:#fffbee;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.drop.has{border-color:var(--ok);background:var(--ok-soft)}
.drop .fn{font-size:13px;font-weight:600;word-break:break-all}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--ink);flex:none}
.locked{margin-top:10px;font-size:13px;color:var(--ok);font-weight:600}
.submit-bar{position:sticky;bottom:0;margin-top:22px;padding:14px 0;background:linear-gradient(to top,var(--paper) 70%,transparent)}
.submit-bar .btn{width:100%;padding:14px;font-size:15px}
.banner{padding:14px 16px;border-radius:12px;margin-top:16px;font-size:14px}
.banner.ok{background:var(--ok-soft);color:#14532d}
.banner.msg{background:var(--warn-soft);color:#5c3700}

.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.chk .ic.ok{background:var(--ok-soft);color:var(--ok)} .chk .ic.bad{background:var(--bad-soft);color:var(--bad)}
.chk .d{font-size:12.5px;color:var(--muted);word-break:break-word}
.testtag{display:inline-block;background:var(--ink);color:var(--sun);font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.next{background:var(--ink);color:#f4efe2;border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.next .nh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.next .nh h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);margin:0}
.next .big{font-family:Archivo,Inter,system-ui,sans-serif;font-size:19px;font-weight:800;line-height:1.25;color:#fff}
.next .why{font-size:13px;color:#d9d3c2;margin-top:4px}
.next ul{margin:10px 0 0;padding:0;list-style:none}
.next li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:5px 0;color:#f4efe2}
.next li .b{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.next li .b.m{background:var(--sun);color:var(--ink)} .next li .b.r{background:#9ec5ff;color:#0b2a5c} .next li .b.ok{background:#8fd3a9;color:#0d3b22}
.next .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.next .btn{border-color:#4a4943;background:transparent;color:#fff}
.next .btn:hover{border-color:#fff}
.next .btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.next .meta{font-size:12px;color:#b9b2a0;margin-top:12px;border-top:1px solid #34332f;padding-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.next .meta b{color:#f4efe2}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.emailprev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:340px;overflow:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad)}
.spin{width:18px;height:18px;border:2.5px solid var(--line-2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:80px 16px;text-align:center;color:var(--muted);display:flex;gap:10px;justify-content:center;align-items:center}
</style>

function toast(msg, bad) {

}
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function yearAgo() { const d = new Date(); d.setFullYear(d.getFullYear() - 1); return ymd(d); }

function fmtWhen(s) { const d = new Date(s); return isNaN(d) ? s : d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function daysUntil(s) { return Math.round((new Date(s + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 864e5); }
function baseUrl() { return location.origin + location.pathname; }
function isArch(p) { return String(p.archived).toUpperCase() === 'TRUE'; }
function isTest(p) { return String(p.isTest).toUpperCase() === 'TRUE'; }

async function api(action, data = {}) {
  if (!/^https:\/\//.test(API_URL)) throw new Error('The portal is not connected yet (API_URL is missing in index.html).');
  const body = Object.assign({ action }, data);
  if (action.indexOf('staff.') === 0 && S.session) body.session = S.session;
  let res, j;
  try { res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }); }
  catch (e) { throw new Error('Could not reach the server. Check your internet connection and try again.'); }
  try { j = await res.json(); } catch (e) { throw new Error('Unexpected response from the server.'); }
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { logout(); throw new Error('Your session expired. Please sign in again.'); }
    throw new Error(j.error || 'Something went wrong.');
  }
  return j;
}

function readFile(file, maxMb) {
  return new Promise((resolve, reject) => {
    if (file.size > maxMb * 1024 * 1024) return reject(new Error(`${file.name} is larger than ${maxMb} MB.`));
    const r = new FileReader();
    r.onload = () => resolve({ name: file.name, type: file.type, data: String(r.result).split(',')[1] || '' });
    r.onerror = () => reject(new Error('Could not read ' + file.name));
    r.readAsDataURL(file);
  });
}

/* ====== Drive folder matching (mirrors the server) ====== */
const NAME_NOISE = ['llc','l l c','inc','incorporated','corp','corporation','co','company','ltd','the','pllc','lp'];
function normName(s) {
  let t = String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9 ]/g, ' ');
  t = ' ' + t.replace(/\s+/g, ' ').trim() + ' ';
  NAME_NOISE.forEach(w => { t = t.split(' ' + w + ' ').join(' '); });
  return t.replace(/\s+/g, '');
}
function matchFolder(company) {
  const n = normName(company); if (!n) return null;
  let best = null, bestScore = 0;
  S.folders.forEach(f => {
    const fn = normName(f.name); if (!fn) return;
    let score = 0;
    if (fn === n) score = 100;
    else if (fn.length >= 4 && n.length >= 4 && (n.indexOf(fn) === 0 || fn.indexOf(n) === 0)) score = 80 - Math.abs(fn.length - n.length);
    else if (fn.length >= 5 && n.length >= 5 && (n.indexOf(fn) >= 0 || fn.indexOf(n) >= 0)) score = 50 - Math.abs(fn.length - n.length);
    if (score > bestScore) { bestScore = score; best = f; }
  });
  return bestScore >= 30 ? best : null;
}
function isConfirmed(p) { return String(p.folderConfirmed).toUpperCase() === 'TRUE'; }
function folderName(id) { const f = S.folders.find(x => x.id === id); return f ? f.name : ''; }
function folderPath(p, choice) {
  const name = choice === 'new' ? p.company + ' (new folder)' : folderName(choice);
  return `Build Partners - All › <b>${esc(name)}</b> › Illinois Shines Designee`;
}
function folderOptions(selected, company) {
  return `<option value="">Choose Drive folder…</option>
    <option value="new" ${selected === 'new' ? 'selected' : ''}>+ Create new folder${company ? ' “' + esc(company) + '”' : ''}</option>
    ${S.folders.map(f => `<option value="${esc(f.id)}" ${f.id === selected ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}`;
}

/* ====== status logic ====== */
const ITEMS = [
  { k: 'reg', short: 'IL Registration', long: 'Illinois Shines online registration', nofile: true },
  { k: 'pdf', short: 'Designee PDF', long: 'Completed Designee Registration Form (PDF)' },
  { k: 'gs', short: 'Good Standing', long: 'IL Secretary of State Statement of Good Standing' },
  { k: 'mes', short: 'MES / EEC', long: 'MES Compliance Plan or EEC Application' },
  { k: 'training', short: 'Training', long: 'Required training modules' }
];
const OPT_LABEL = {
  missing: 'Missing', received: 'Received – needs review', verified: 'Verified', rejected: 'Rejected – needs new copy', na: 'N/A – does not qualify'
};
const REG_LABEL = { missing: 'Not confirmed', received: 'Partner confirmed – check', verified: 'Verified', rejected: 'Rejected – could not confirm' };
const TRAIN_LABEL = { missing: 'Not done', received: 'Reported done – confirm', verified: 'Verified complete', rejected: 'Rejected' };

function gsOk(p) { return !!p.gsDate && p.gsDate >= yearAgo(); }
function evalP(p) {
  const t = todayStr(), c = S.config;
  const docs = p.regStatus === 'verified' && p.pdfStatus === 'verified' && p.gsStatus === 'verified' && gsOk(p) && (p.mesStatus === 'verified' || p.mesStatus === 'na');
  const tr = p.trainingStatus === 'verified';
  const review = ITEMS.some(i => p[i.k + 'Status'] === 'received');
  const regOver = !docs && c.regDeadline && t > c.regDeadline;
  const trOver = !tr && c.trainingDeadline && t > c.trainingDeadline;
  const fuDue = !!p.nextFollowUp && p.nextFollowUp <= t && !(docs && tr);
  let overall, tone;
  if (docs && tr) { overall = 'Fully compliant'; tone = 'ok'; }
  else if (regOver || trOver) { overall = 'Overdue'; tone = 'bad'; }
  else if (review) { overall = 'Needs review'; tone = 'info'; }
  else if (docs) { overall = 'Docs done · training left'; tone = 'ok'; }
  else { overall = 'Waiting on partner'; tone = 'warn'; }
  return { docs, tr, review, regOver, trOver, fuDue, overall, tone };
}
function missingList(p) {
  const m = [];
  const bad = k => ['missing', 'rejected', ''].includes(p[k + 'Status'] || '');
  if (bad('reg')) m.push(p.regStatus === 'rejected' ? 'Illinois Shines online registration (could not confirm)' : 'Illinois Shines online registration (select GOODPWR LLC, ID 2167)');
  if (bad('pdf')) m.push(p.pdfStatus === 'rejected' ? 'New copy of the Designee PDF (last one rejected)' : 'Completed Designee Registration Form (PDF)');
  const gsOld = p.gsDate && !gsOk(p);
  if (bad('gs') || gsOld) m.push(gsOld || p.gsStatus === 'rejected' ? 'Newer Good Standing statement (must be within 12 months)' : 'Secretary of State Good Standing statement');
  if (bad('training')) m.push('Training modules completed');
  if (bad('mes')) m.push('MES plan / EEC application – or mark “does not apply”');
  return m;
}
function reviewList(p) { return ITEMS.filter(i => p[i.k + 'Status'] === 'received').map(i => i.short); }

function nextCard(p) {
  const miss = missingList(p), rev = reviewList(p), e = evalP(p);
  const needFolder = !isConfirmed(p) && !isTest(p);
  let big, why, acts = '';
  if (!miss.length && !rev.length && !needFolder) {
    big = 'All set – nothing to do ✓'; why = `${esc(p.company)} has every document verified${e.tr ? ' and training confirmed' : ''}.`;
  } else if (rev.length) {
    big = `Review ${rev.length} new upload${rev.length > 1 ? 's' : ''}`;
    why = 'Open each file below, then set it to <b>Verified</b> – or <b>Rejected</b> and tell them what to fix in the message box.';
    acts += `<button class="btn sm sun" data-jump="checklist">Review uploads ↓</button>`;
  } else if (needFolder) {
    big = 'Confirm where their files are saved';
    why = 'Check the suggested Drive folder below so uploads land in the right Build Partner folder.';
    acts += `<button class="btn sm sun" data-jump="folder">Confirm Drive folder ↓</button>`;
  } else {
    big = e.fuDue ? `Time to follow up – ${miss.length} item${miss.length > 1 ? 's' : ''} missing` : `Waiting on ${miss.length} item${miss.length > 1 ? 's' : ''} from ${esc(p.company)}`;
    why = e.fuDue ? 'Send a reminder – it lists exactly what is missing and includes their upload link.' : `Next follow-up is ${fmtDate(p.nextFollowUp)}. You can send a reminder anytime.`;
  }
  if (miss.length) acts += `<button class="btn sm ${rev.length || needFolder ? '' : 'sun'}" id="remBtn">Send reminder email</button><button class="btn sm" id="prevBtn">Preview reminder</button>`;
  acts += `<button class="btn sm" id="copyBtn">Copy upload link</button>`;
  const list = [
    ...rev.map(t => `<li><span class="b r">!</span><span><b>Received:</b> ${esc(t)} – needs your review</span></li>`),
    ...miss.map(t => `<li><span class="b m">•</span><span><b>Missing:</b> ${esc(t)}</span></li>`)
  ];
  return `<div class="next">
    <div class="nh"><h3>What's next</h3>${chip(e.overall, e.tone)}</div>
    <div class="big">${big}</div>
    <div class="why">${why}</div>
    ${list.length ? `<ul>${list.join('')}</ul>` : ''}
    <div class="acts">${acts}</div>
    <div class="meta">
      <span>Last contact: <b>${p.lastFollowUp ? fmtDate(p.lastFollowUp) : (p.invitedAt ? 'Invite ' + fmtDate(p.invitedAt) : '—')}</b></span>
      <span>Next follow-up: <b>${p.nextFollowUp && miss.length ? fmtDate(p.nextFollowUp) : '—'}</b></span>
      <span>${folderLine(p).replace(/<[^>]+>/g, '')}</span>
    </div>
  </div>`;
}

function chip(text, tone) { return `<span class="chip t-${tone}">${esc(text)}</span>`; }
function itemChip(p, k) {
  const s = p[k + 'Status'] || 'missing';
  if (k === 'gs' && p.gsDate && !gsOk(p) && s !== 'missing') return chip('Too old', 'bad');
  const m = { missing: ['Missing', 'warn'], received: [k === 'training' || k === 'reg' ? 'Confirmed' : 'Review', 'info'], verified: ['Verified', 'ok'], rejected: ['Rejected', 'bad'], na: ['N/A', 'mute'] }[s] || ['—', 'mute'];
  return chip(m[0], m[1]);
}

      renderDash();
    } else app.innerHTML = `<div class="loading"><span class="spin"></span> Loading Build Partners…</div>`;
  }
  try {
    const j = await api('staff.list');
    S.partners = j.partners; S.config = j.config; S.folders = j.folders || [];

function counts() {
  const act = S.partners.filter(p => !isArch(p) && !isTest(p));
  const ev = act.map(p => evalP(p));
  return {
    active: act.length,
    review: ev.filter(e => e.review).length,
    missing: ev.filter(e => !e.docs).length,
    docs: ev.filter(e => e.docs).length,
    training: ev.filter(e => !e.tr).length,

    overdue: ev.filter(e => e.regOver || e.trOver).length,
    compliant: ev.filter(e => e.docs && e.tr).length
  };
}

function dueIds() {
  return S.partners.filter(p => !isArch(p) && !isTest(p) && evalP(p).fuDue && missingList(p).length).map(p => p.id);
}
async function remindAll() {
  const ids = dueIds();
  const names = S.partners.filter(p => ids.includes(p.id)).map(p => '• ' + p.company + ' (' + missingList(p).length + ' missing)').join('\n');
  if (!confirm(`Send a reminder email to ${ids.length} Build Partner(s) whose follow-up is due?\n\n${names}\n\nEach email lists only what that partner is missing, with their upload link.`)) return;
  await busy($('#remAllBtn'), async () => {
    const j = await api('staff.remindAll', { ids, baseUrl: baseUrl() });
    j.results.filter(r => r.ok).forEach(r => replacePartner(r.partner));
    const bad = j.results.filter(r => !r.ok);
    renderDash();
    toast(`${j.results.length - bad.length} reminder(s) sent` + (bad.length ? ` · ${bad.length} failed: ${bad[0].error}` : ''), bad.length > 0);
  });
}

function filtered() {
  const q = S.q.trim().toLowerCase();
  return S.partners.filter(p => {
    const arch = isArch(p);
    if (S.filter === 'archived') { if (!arch) return false; }
    else if (arch) return false;
    const e = evalP(p);
    if (S.filter === 'review' && !e.review) return false;
    if (S.filter === 'missing' && e.docs) return false;
    if (S.filter === 'training' && e.tr) return false;
    if (S.filter === 'followup' && !e.fuDue) return false;
    if (S.filter === 'overdue' && !(e.regOver || e.trOver)) return false;
    if (S.filter === 'compliant' && !(e.docs && e.tr)) return false;
    if (S.filter === 'folder' && isConfirmed(p)) return false;
    if (S.filter === 'tests' && !isTest(p)) return false;
    if (S.filter !== 'tests' && S.filter !== 'active' && isTest(p)) return false;
    if (q && ![p.company, p.contact, p.email, p.id].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const ea = evalP(a), eb = evalP(b);
    const rank = e => (e.regOver || e.trOver) ? 0 : e.review ? 1 : e.fuDue ? 2 : (e.docs && e.tr) ? 4 : 3;
    return (isTest(a) - isTest(b)) || rank(ea) - rank(eb) || String(a.company).localeCompare(String(b.company));
  });
}

        </div>
        <div style="height:12px"></div>
        <label class="f">Internal notes (staff only)</label>
        <textarea class="in-f" data-f="notes">${esc(p.notes)}</textarea>
      </div>

      <div class="sec"><h3>Activity</h3><div id="act"><span class="spin"></span></div></div>
    </div>
    <div class="df">
      <button class="btn ghost danger" id="archBtn">${isArch(p) ? 'Restore' : 'Archive'}</button>
      <div style="display:flex;gap:8px"><button class="btn" data-close>Close</button><button class="btn primary" id="saveBtn">Save changes</button></div>
    </div>
  </aside>`;
  bindClose();

  $$('[data-jump]', layer).forEach(b => b.onclick = () => {
    const el = $('#sec-' + b.dataset.jump) || $('#fdSel');
    const target = b.dataset.jump === 'folder' ? ($('#fdSel') && $('#fdSel').closest('.sec')) : el;
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const sendRem = async (btn, note) => {
    await busy(btn, async () => {
      const j = await api('staff.remind', { id: p.id, baseUrl: baseUrl(), note: note || '' });
      replacePartner(j.partner); renderList(); renderDrawer(); loadActivity(p.id); refreshStats();
      toast('Reminder sent to ' + p.email);
    });
  };
  if ($('#remBtn')) $('#remBtn').onclick = () => {
    if (confirm(`Email ${p.email} a reminder listing the ${missingList(p).length} missing item(s) with their upload link?`)) sendRem($('#remBtn'), p.partnerMessage);
  };
  if ($('#prevBtn')) $('#prevBtn').onclick = () => openReminderPreview(p);
  if (isTest(p)) {
    const ab = $('#archBtn'); ab.textContent = 'Delete test';
    ab.onclick = async () => {
      if (!confirm('Delete this test partner and its test uploads?')) return;
      await busy(ab, async () => {
        await api('staff.deleteTest', { id: p.id });
        S.partners = S.partners.filter(x => x.id !== p.id); saveListCache();
        closeLayer(); renderDash(); toast('Test deleted');
      });
    };
  }
  if ($('#fdSel')) $('#fdSel').onchange = e => { $('#fdPath').innerHTML = e.target.value ? folderPath(p, e.target.value) : '<span class="muted">Pick the folder from Build Partners - All</span>'; };
  if ($('#fdBtn')) $('#fdBtn').onclick = async () => {
    const choice = $('#fdSel').value;
    if (!choice) return toast('Pick a Drive folder first.', true);
    const name = choice === 'new' ? `a new folder “${p.company}”` : `“${folderName(choice)}”`;
    if (!confirm(`Save ${p.company}'s Illinois Shines documents to ${name} in Build Partners - All?` + (ITEMS.some(i => p[i.k + 'FileId']) ? '\n\nFiles already uploaded will be moved there.' : ''))) return;
    await busy($('#fdBtn'), async () => {
      const j = await api('staff.confirmFolder', { id: p.id, folderChoice: choice });
      replacePartner(j.partner); renderList(); renderDrawer(); loadActivity(p.id);
      toast('Folder confirmed' + (j.moved ? ` · ${j.moved} file(s) moved` : '') + (j.failed ? ` · ${j.failed} could not be moved` : ''), j.failed > 0);
    });
  };

  $('#saveBtn').onclick = async () => {
    const fields = {};
    $$('[data-f]', layer).forEach(el => fields[el.dataset.f] = el.value);
    await busy($('#saveBtn'), async () => {
      const j = await api('staff.update', { id: p.id, fields, baseUrl: baseUrl() });
      replacePartner(j.partner); renderList(); renderDrawer(); loadActivity(p.id); refreshStats();
      if (j.becameCompliant) toast('🎉 ' + p.company + ' is Fully compliant' + (j.complianceNotified ? ' · Compliance was notified' : ''));
      else if (j.notified) toast('Saved · ' + p.email + ' was emailed what to fix');
      else if (j.notifyError) toast('Saved, but the rejection email failed: ' + j.notifyError, true);
      else toast('Saved');
    });
  };
  if (!isTest(p)) $('#archBtn').onclick = async () => {
    if (!isArch(p) && !confirm(`Archive ${p.company}? Their upload link will stop working.`)) return;
    await busy($('#archBtn'), async () => {
      const j = await api('staff.update', { id: p.id, fields: { archived: isArch(p) ? '' : 'TRUE' } });
      replacePartner(j.partner); closeLayer(); renderDash();
      toast(isArch(j.partner) ? 'Archived' : 'Restored');
    });
  };
  $('#copyBtn').onclick = async () => {
    const link = baseUrl() + '?t=' + p.token;
    try { await navigator.clipboard.writeText(link); toast('Upload link copied'); }
    catch (e) { prompt('Copy this upload link:', link); }
  };
  $('#inviteBtn').onclick = async () => {
    if (!confirm(`Send the Illinois Shines invite email to ${p.email}?`)) return;
    await busy($('#inviteBtn'), async () => {
      const j = await api('staff.invite', { id: p.id, baseUrl: baseUrl() });
      replacePartner(j.partner); renderList(); renderDrawer(); loadActivity(p.id);
      toast('Invite sent to ' + p.email);
    });
  };
  $('#fuBtn').onclick = async () => {
    await busy($('#fuBtn'), async () => {
      const j = await api('staff.followup', { id: p.id, note: $('#fuNote').value, days: $('#fuDays').value });
      replacePartner(j.partner); renderList(); renderDrawer(); loadActivity(p.id); refreshStats();
      toast('Follow-up logged');
    });
  };
  $$('[data-up]', layer).forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const lbl = inp.parentElement; const old = lbl.firstChild.textContent;
    lbl.firstChild.textContent = 'Uploading…';
    try {
      const file = await readFile(f, 10);
      const j = await api('staff.upload', { id: p.id, item: inp.dataset.up, file });
      replacePartner(j.partner); renderList(); renderDrawer(); loadActivity(p.id); refreshStats();
      toast('File attached');
    } catch (e) { lbl.firstChild.textContent = old; toast(e.message, true); }
  });
}

function folderLine(p) {
  if (isConfirmed(p)) return `Drive folder: <b>${esc(p.bpFolderId ? folderName(p.bpFolderId) || 'Saved folder' : p.company + ' (new)')}</b> ✓`;
  return `<span style="color:var(--warn);font-weight:600">Drive folder not confirmed</span> <span class="muted">– uploads wait in a holding folder until you confirm</span>`;
}

function folderSection(p) {
  const conf = isConfirmed(p);
  const suggested = conf ? (p.bpFolderId || 'new') : (p.bpFolderId || (matchFolder(p.company) || {}).id || '');
  return `<div class="sec">
    <h3>Drive folder ${conf ? chip('Confirmed', 'ok') : chip('Needs confirmation', 'warn')}</h3>
    <div class="folderbox ${conf ? 'ok' : 'warn'}">
      <label class="f">Save ${esc(p.company)}'s documents to</label>
      <select class="in-f" id="fdSel">${folderOptions(suggested, p.company)}</select>
      <div class="path" id="fdPath">${suggested ? folderPath(p, suggested) : '<span class="muted">Pick the folder from Build Partners - All</span>'}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <button class="btn sm ${conf ? '' : 'primary'}" id="fdBtn">${conf ? 'Change folder' : 'Confirm this folder'}</button>
        <span class="small muted">${conf ? 'Already-uploaded files move to the new folder automatically.' : (!suggested ? 'No matching folder found.' : 'Suggested from the company name – please check it.')}</span>
      </div>
    </div>
  </div>`;
}

function refreshStats() {
  // light re-render of the counters without losing the drawer
  const c = counts();
  const map = { active: c.active, review: c.review, missing: c.missing, training: c.training, followup: c.followup, compliant: c.compliant };
  $$('.stat').forEach(el => { const n = map[el.dataset.filter]; if (n !== undefined) $('.n', el).textContent = n; });
}

async function loadActivity(id) {
  try {
    const j = await api('staff.activity', { id });
    const box = $('#act'); if (!box || S.sel !== id) return;
    box.innerHTML = j.activity.length ? j.activity.map(a => `
      <div class="act"><b>${esc(a.action)}</b>${a.detail ? ' – ' + esc(a.detail) : ''}<div class="muted">${fmtWhen(a.at)} · ${esc(a.actor)}</div></div>`).join('')
      : '<span class="muted small">No activity yet.</span>';
  } catch (e) { const box = $('#act'); if (box) box.innerHTML = `<span class="muted small">${esc(e.message)}</span>`; }
}

async function busy(btn, fn) {
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try { await fn(); } catch (e) { toast(e.message, true); }
  finally { if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = html; } }
}

    </div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn primary" id="addGo">Create request</button></div>
  </div>`;
  bindClose();
  const bindRows = () => {
    $$('[data-rm]', layer).forEach(b => b.onclick = () => { if ($$('.addrow', layer).length > 1) b.parentElement.remove(); });
    $$('.addrow', layer).forEach(r => {
      const co = $('[data-a=company]', r), sel = $('[data-a=folder]', r);
      if (co._bound) return; co._bound = true;
      const suggest = () => {
        if (sel.dataset.touched) return;
        const m = matchFolder(co.value);
        sel.innerHTML = folderOptions(m ? m.id : (co.value.trim() ? 'new' : ''), co.value.trim());
        sel.classList.toggle('need', !sel.value);
      };
      co.addEventListener('input', suggest);
      sel.onchange = () => { sel.dataset.touched = '1'; sel.classList.toggle('need', !sel.value); };
    });
  };
  bindRows();
  $('#moreBtn').onclick = () => { $('#rows').insertAdjacentHTML('beforeend', addRowHTML()); bindRows(); };
  $('#addGo').onclick = async () => {
    const partners = $$('.addrow', layer).map(r => ({
      company: $('[data-a=company]', r).value.trim(), contact: $('[data-a=contact]', r).value.trim(),
      email: $('[data-a=email]', r).value.trim(), folderChoice: $('[data-a=folder]', r).value
    })).filter(x => x.company || x.email);
    const bad = partners.find(x => !x.company || !x.email);
    if (!partners.length || bad) return toast('Each row needs a company name and an email.', true);
    const noFolder = partners.find(x => !x.folderChoice);
    if (noFolder) return toast(`Choose a Drive folder for ${noFolder.company}.`, true);
    const summary = partners.map(x => `• ${x.company}  →  ${x.folderChoice === 'new' ? 'NEW folder "' + x.company + '"' : folderName(x.folderChoice)}`).join('\n');
    if (!confirm('Create Designee request(s)? Please confirm the Drive folders:\n\n' + summary + '\n\nDocuments will be saved in each folder\'s "Illinois Shines Designee" subfolder.')) return;
    const sendInvite = $('input[name=mode]:checked', layer).value === 'invite';
    await busy($('#addGo'), async () => {
      const j = await api('staff.add', { partners, sendInvite, baseUrl: baseUrl() });
      const r = j.results;
      const added = r.filter(x => x.id).length, skipped = r.filter(x => x.skipped), failed = r.filter(x => x.inviteError);
      closeLayer(); await loadDash();
      let msg = `${added} request(s) created` + (sendInvite ? `, ${r.filter(x => x.invited).length} emailed` : '');
      if (skipped.length) msg += ` · ${skipped.length} skipped (already in portal)`;
      if (failed.length) msg += ` · invite failed for ${failed.map(x => x.company).join(', ')}: ${failed[0].inviteError}`;
      toast(msg, failed.length > 0);
    });
  };
}

function pStatusLine(s, k) {
  if (s === 'verified') return `<div class="locked">✓ Accepted by GoodPWR Solar</div>`;
  if (s === 'received') return `<div class="small" style="margin-top:8px;color:var(--info);font-weight:600">${k === 'reg' ? 'Confirmed – GoodPWR Solar will check it against your Designee PDF.' : 'Received – GoodPWR Solar is reviewing it. You can replace it below if needed.'}</div>`;
  if (s === 'rejected') return `<div class="small" style="margin-top:8px;color:var(--bad);font-weight:600">${k === 'reg' ? 'We could not confirm your registration. Make sure you selected GOODPWR LLC (ID 2167), then tick the box again.' : 'Please upload a new copy' + (k === 'gs' ? ' (issued within the past 12 months)' : '') + '.'}</div>`;
  if (s === 'na') return `<div class="small" style="margin-top:8px;color:var(--mute);font-weight:600">Marked as not applicable to your business.</div>`;
  return '';
}

  app.innerHTML = `

      <div class="small muted">${done} of 5 items submitted · You must be fully compliant before performing Illinois installation work for GoodPWR Solar.</div>
      <div class="pdl">
        <div class="pill">Submit to GoodPWR by <b>${fmtDate(cfg.regDeadline)}</b></div>
        <div class="pill">Illinois Shines deadline <b>${fmtDate(cfg.stateDeadline || cfg.regDeadline)}</b></div>
        <div class="pill">Training due <b>${fmtDate(cfg.trainingDeadline)}</b></div>
      </div>
      ${S.pp.justSent ? `<div class="banner ok"><b>Thank you!</b> We received: ${esc(S.pp.justSent.join(', '))}.${done < 5 ? ' Please come back to this page to send the remaining items.' : ' GoodPWR Solar will review your documents.'}</div>` : ''}
      ${p.partnerMessage ? `<div class="banner msg"><b>Message from GoodPWR Solar:</b> ${esc(p.partnerMessage)}</div>` : ''}
    </section>

    <div class="card step-card ${isDone('reg') ? 'done' : ''}">
      <div class="step-head"><h2><span class="num">1</span>Register online with Illinois Shines</h2></div>
      <p>Sign the Illinois Shines Designee Registration Form online. Select <b>${esc(info.avName)}</b> (Approved Vendor ID <b>${esc(info.avId)}</b>) as your Approved Vendor.</p>
      <p style="margin-top:12px"><a class="btn primary" href="${esc(info.officialUrl)}" target="_blank" rel="noopener">Open the Illinois Shines form ↗</a></p>
      ${pStatusLine(p.regStatus, 'reg')}
      ${['missing', 'rejected', ''].includes(p.regStatus || 'missing') ? `
        <label class="check"><input type="checkbox" id="regDone" ${S.pp.regDone ? 'checked' : ''}><span>We registered online and selected ${esc(info.avName)} (ID ${esc(info.avId)}) as our Approved Vendor.</span></label>` : ''}
    </div>

    <div class="card step-card ${isDone('pdf') ? 'done' : ''}">
      <h2><span class="num">2</span>Upload your completed Designee Registration Form</h2>
      <p class="muted">The PDF copy of your completed form, showing your connection to ${esc(info.avName)}.</p>
      ${pStatusLine(p.pdfStatus, 'pdf')}
      ${open('pdf') ? drop('pdf', '.pdf') : ''}
    </div>

    <div class="card step-card ${isDone('gs') ? 'done' : ''}">
      <h2><span class="num">3</span>Illinois Secretary of State Statement of Good Standing</h2>
      <p class="muted">Must be issued within the past 12 months (on or after ${fmtDate(yearAgo())}).</p>
      ${pStatusLine(p.gsStatus, 'gs')}
      ${open('gs') ? `
        <div style="margin-top:12px;max-width:260px"><label class="f" for="gsDate">Date issued</label><input class="in-f" type="date" id="gsDate" value="${esc(S.pp.gsDate || (p.gsStatus === 'rejected' ? '' : p.gsDate) || '')}" max="${todayStr()}"></div>
        ${drop('gs', '.pdf,.png,.jpg,.jpeg,.heic')}` : ''}
    </div>

    <div class="card step-card ${isDone('training') ? 'done' : ''}">
      <h2><span class="num">4</span>Complete all required training modules</h2>
      <p class="muted">Training must be completed by ${fmtDate(cfg.trainingDeadline)}.</p>
      ${pStatusLine(p.trainingStatus, 'training')}
      ${open('training') ? `
        <label class="check"><input type="checkbox" id="trDone" ${S.pp.trDone ? 'checked' : ''}><span>We have completed all required Illinois Shines training modules.</span></label>
        <div style="margin-top:10px;max-width:260px"><label class="f" for="trDate">Date completed</label><input class="in-f" type="date" id="trDate" value="${esc(S.pp.trDate || p.trainingDate || '')}" max="${todayStr()}"></div>
        <div class="small muted" style="margin-top:10px">Certificate or screenshot (optional)</div>
        ${drop('training', '.pdf,.png,.jpg,.jpeg,.heic')}` : ''}
    </div>

    <div class="card step-card ${isDone('mes') ? 'done' : ''}">
      <h2><span class="num">5</span>MES Compliance Plan or EEC Application</h2>
      <p class="muted">Submit a Minimum Equity Standard (MES) Compliance Plan or an Equity Eligible Contractor (EEC) application, if your business qualifies.</p>
      ${pStatusLine(p.mesStatus, 'mes')}
      ${open('mes') && p.mesStatus !== 'na' ? `
        ${drop('mes', '.pdf,.png,.jpg,.jpeg,.heic,.doc,.docx')}
        <label class="check"><input type="checkbox" id="mesNA" ${S.pp.mesNA ? 'checked' : ''}><span>This does not apply – our business does not qualify for MES or EEC.</span></label>` : ''}
    </div>

    <div class="submit-bar"><button class="btn sun" id="pSubmit">Submit to GoodPWR Solar</button></div>
    <p class="small muted" style="text-align:center">Questions? Email <a href="mailto:${esc(info.contact)}">${esc(info.contact)}</a></p>
  </main>`;

  // keep typed values when re-rendering
  const keep = () => {
    if ($('#gsDate')) S.pp.gsDate = $('#gsDate').value;
    if ($('#trDone')) S.pp.trDone = $('#trDone').checked;
    if ($('#trDate')) S.pp.trDate = $('#trDate').value;
    if ($('#mesNA')) S.pp.mesNA = $('#mesNA').checked;
    if ($('#regDone')) S.pp.regDone = $('#regDone').checked;
  };
  $$('[data-pf]').forEach(inp => inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > info.maxMb * 1024 * 1024) { toast(`${f.name} is larger than ${info.maxMb} MB.`, true); return; }
    if (inp.dataset.pf === 'pdf' && !/\.pdf$/i.test(f.name)) { toast('Please upload the form as a PDF.', true); return; }
    keep(); S.pp.files[inp.dataset.pf] = f;
    if (inp.dataset.pf === 'mes') S.pp.mesNA = false; S.pp.regDone = false;
    renderPartner();
  });
  if ($('#mesNA')) $('#mesNA').onchange = e => { keep(); if (e.target.checked) delete S.pp.files.mes; renderPartner(); };
  ['#gsDate', '#trDate', '#trDone', '#regDone'].forEach(s => { if ($(s)) $(s).onchange = keep; });
  $('#pSubmit').onclick = submitPartner;
}

async function submitPartner() {
  const st = S.pp, info = st.info;
  const gsDate = $('#gsDate') ? $('#gsDate').value : '';
  const trainingDone = $('#trDone') ? $('#trDone').checked : false;
  const trainingDate = $('#trDate') ? $('#trDate').value : '';
  const mesNA = $('#mesNA') ? $('#mesNA').checked : false;
  const regDone = $('#regDone') ? $('#regDone').checked : false;
  if (st.files.gs) {
    if (!gsDate) return toast('Enter the date your Good Standing statement was issued.', true);
    if (gsDate < yearAgo()) return toast('The Good Standing statement must be issued within the past 12 months.', true);
  }
  if (st.files.training && !trainingDone) return toast('Check the training box to confirm you completed all modules.', true);
  const hasAny = Object.keys(st.files).length || mesNA || trainingDone || regDone;
  if (!hasAny) return toast('Add at least one document or check a box before submitting.', true);

  const btn = $('#pSubmit');
  await busy(btn, async () => {
    btn.innerHTML = '<span class="spin"></span>&nbsp; Uploading…';
    const files = {};
    for (const k of Object.keys(st.files)) files[k] = await readFile(st.files[k], info.maxMb);
    const j = await api('partner.submit', { t: st.t, files, gsDate, mesNA, trainingDone, trainingDate, regDone });
    S.pp.partner = j.partner; S.pp.files = {}; S.pp.justSent = j.received;
    S.pp.gsDate = ''; S.pp.trDone = false; S.pp.trDate = ''; S.pp.mesNA = false;
    renderPartner(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}
</script>

/* "All portals" shortcut back to the GoodPWR Solar Partner Hub (staff views only) */

a.style.cssText='position:fixed;left:14px;bottom:14px;z-index:15;background:#141414;color:#fff;font:600 13px/1 Inter,system-ui,sans-serif;padding:9px 13px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:.9';
var show=function(){return !/[?&]t=/.test(location.search);};var u=function(){a.style.display=show()?'block':'none';};document.body.appendChild(a);u();window.addEventListener('hashchange',u);})();
</script>
</body>
